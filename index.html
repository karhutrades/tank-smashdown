/* ---------------- profiles (localStorage) ---------------- */
const PKEY='tanksmash_profiles_v1';
let profiles=[],slots=[0,1],store=true;
function blankProfile(name){
  return{name:name||'PLAYER',color:SWATCHES[0],last:1,
    stats:{wins:0,losses:0,kos:0,rounds:0,campaign:0,plays:{}}};
}
function loadProfiles(){
  try{
    const raw=localStorage.getItem(PKEY);
    if(raw){const d=JSON.parse(raw);profiles=d.profiles||[];slots=d.slots||[0,1]}
  }catch(e){store=false}
  if(!profiles.length)profiles=[blankProfile('PLAYER 1'),blankProfile('PLAYER 2')];
  profiles.forEach(p=>{
    p.stats=p.stats||{};
    const s=p.stats;
    s.wins=s.wins|0;s.losses=s.losses|0;s.kos=s.kos|0;s.rounds=s.rounds|0;s.campaign=s.campaign|0;
    s.plays=s.plays||{};
    if(typeof p.last!=='number')p.last=1;
    if(!p.color)p.color=SWATCHES[0];
  });
  if(profiles[1])profiles[1].color=profiles[1].color===profiles[0].color?SWATCHES[3]:profiles[1].color;
  slots=[Math.min(slots[0]|0,profiles.length-1),Math.min(slots[1]|0,profiles.length-1)];
}
function saveProfiles(){
  if(!store)return;
  try{localStorage.setItem(PKEY,JSON.stringify({profiles,slots}))}catch(e){store=false}
}
function prof(team){return profiles[slots[team]]||profiles[0]}
function isUnlocked(ci,p){
  const u=CLASSES[ci].unlock;
  if(!u||!p)return true;
  return (p.stats[u.k]|0)>=u.n;
}
function unlockedCount(p){return CLASSES.filter((c,i)=>isUnlocked(i,p)).length}
function teamColor(team){
  const t=tanks&&tanks[team];
  if(t&&t.profColor)return t.profColor;
  const p=prof(team);
  return (p&&p.color)||TEAMS[team].color;
}
loadProfiles();

let AC=null,muted=false;
function audioOn(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function sfx(f0,f1,dur,type,vol){
  if(muted||!AC)return;
  const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur);
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawPortrait(x,y,r,tint,ring){
  cx.save();
  cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.clip();
  if(IMG.complete&&IMG.naturalWidth)cx.drawImage(IMG,x-r,y-r,r*2,r*2);
  else{cx.fillStyle=CREAM;cx.fillRect(x-r,y-r,r*2,r*2)}
  if(tint){cx.globalAlpha=.26;cx.fillStyle=tint;cx.fillRect(x-r,y-r,r*2,r*2);cx.globalAlpha=1}
  cx.restore();
  cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);
  cx.lineWidth=ring?7:3;cx.strokeStyle=INK;cx.stroke();
  if(ring){cx.lineWidth=3.5;cx.strokeStyle=ring;cx.stroke()}
}

}
function lerpAngle(a,b,k){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d*k}
function burst(x,y,color,n,pow){

    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*22,color,size:3+Math.random()*4});}
}

/* ---------------- movers ---------------- */
function moverOff(mv,f){
  const t=(f+(mv.phase||0))/mv.period*Math.PI*2;
  return (1-Math.cos(t))/2*mv.range*T;
}
function moverRect(mv){
  const off=moverOff(mv,frame);
  return {x:mv.gx*T+(mv.axis==='h'?off:0),y:mv.gy*T+(mv.axis==='v'?off:0),w:T,h:T,
    vx:mv.axis==='h'?off-moverOff(mv,frame-1):0,vy:mv.axis==='v'?off-moverOff(mv,frame-1):0};
}
function circleVsRect(x,y,r,rc){
  const nx=Math.max(rc.x,Math.min(x,rc.x+rc.w)),ny=Math.max(rc.y,Math.min(y,rc.y+rc.h));
  return (x-nx)*(x-nx)+(y-ny)*(y-ny)<r*r;
}

/* ---------------- grid collision ---------------- */
const GATES={R:[1,0],L:[-1,0],D:[0,1],U:[0,-1]};
function cellSolid(c,mode,dx,dy,ghost){
  if(c==='#')return !ghost;
  if(c==='x')return mode==='tank'?!ghost:true;
  if(c==='~')return mode==='tank'&&!ghost;
  if(GATES[c]){
    const g=GATES[c];
    if(g[0])return !( (g[0]>0&&dx>0.01)||(g[0]<0&&dx<-0.01) );
    return !( (g[1]>0&&dy>0.01)||(g[1]<0&&dy<-0.01) );
  }
  return false;
}
function hitCell(x,y,r,mode,dx,dy,ghost){
  const x0=Math.max(0,(x-r)/T|0),x1=Math.min(COLS-1,(x+r)/T|0);
  const y0=Math.max(0,(y-r)/T|0),y1=Math.min(ROWS-1,(y+r)/T|0);
  for(let gy=y0;gy<=y1;gy++)for(let gx=x0;gx<=x1;gx++){
    const border=gx===0||gx===COLS-1||gy===0||gy===ROWS-1;
    const c=cells[gy][gx];
    if(!cellSolid(c,mode,dx||0,dy||0,ghost&&!border))continue;
    const rx=gx*T,ry=gy*T;
    const nx=Math.max(rx,Math.min(x,rx+T)),ny=Math.max(ry,Math.min(y,ry+T));
    if((x-nx)*(x-nx)+(y-ny)*(y-ny)<r*r)return{c,gx,gy};
  }
  return null;
}
function moverHit(x,y,r){
  for(const mv of movers){if(circleVsRect(x,y,r,moverRect(mv)))return mv}
  return null;
}
function tryMove(t,dx,dy){
  const gh=t.fx&&t.fx.ghost>0,r=t.cls.radius;
  if(dx&&!hitCell(t.x+dx,t.y,r,'tank',dx,0,gh)&&!moverHit(t.x+dx,t.y,r))t.x+=dx;
  if(dy&&!hitCell(t.x,t.y+dy,r,'tank',0,dy,gh)&&!moverHit(t.x,t.y+dy,r))t.y+=dy;
}
function tileAt(x,y){
  const gx=Math.max(0,Math.min(COLS-1,x/T|0)),gy=Math.max(0,Math.min(ROWS-1,y/T|0));
  return cells[gy][gx];
}
function nearestFree(x,y){
  for(let rad=0;rad<8;rad++)for(let gy=1;gy<ROWS-1;gy++)for(let gx=1;gx<COLS-1;gx++){
    if(Math.abs(gx-(x/T|0))+Math.abs(gy-(y/T|0))!==rad)continue;
    if(cells[gy][gx]==='.'||cells[gy][gx]==='*'||cells[gy][gx]==='b')return{x:gx*T+T/2,y:gy*T+T/2};
  }
  return{x,y};
}

/* ---------------- arena prerender ---------------- */
function prerenderArena(m,mi){
  bgx.clearRect(0,0,W,H);
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){
    bgx.fillStyle=((gx+gy)&1)?m.floorA:m.floorB;
    bgx.fillRect(gx*T,gy*T,T,T);
  }
  let s=mi*137+11;const rnd=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let gy=1;gy<ROWS-1;gy++)for(let gx=1;gx<COLS-1;gx++){
    const c=m.grid[gy][gx];
    if(c==='.'&&rnd()<.09)drawDecal(bgx,m.decal,gx*T+8+rnd()*(T-16),gy*T+8+rnd()*(T-16),rnd);
    else if(c==='*')drawIceTile(bgx,gx,gy,rnd);
    else if(GATES[c])drawGate(bgx,gx,gy,c,m);
  }
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){
    if(m.grid[gy][gx]!=='~')continue;
    bgx.fillStyle=m.liqA;bgx.fillRect(gx*T,gy*T,T,T);
  }
  bgx.strokeStyle=INK;bgx.lineWidth=2.5;
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){
    if(m.grid[gy][gx]!=='~')continue;
    const x=gx*T,y=gy*T,at=(a,b)=>m.grid[b]&&(m.grid[b][a]==='~'||m.grid[b][a]==='#');
    bgx.beginPath();
    if(!at(gx,gy-1)){bgx.moveTo(x,y+1);bgx.lineTo(x+T,y+1)}
    if(!at(gx,gy+1)){bgx.moveTo(x,y+T-1);bgx.lineTo(x+T,y+T-1)}
    if(!at(gx-1,gy)){bgx.moveTo(x+1,y);bgx.lineTo(x+1,y+T)}
    if(!at(gx+1,gy)){bgx.moveTo(x+T-1,y);bgx.lineTo(x+T-1,y+T)}
    bgx.stroke();
  }
  // soft shadows then solid blocks
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){
    if(m.grid[gy][gx]!=='#')continue;
    bgx.fillStyle='rgba(34,35,59,.28)';rr(bgx,gx*T+5,gy*T+6,T-4,T-4,8);bgx.fill();
  }
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){
    if(m.grid[gy][gx]!=='#')continue;
    const x=gx*T,y=gy*T;
    bgx.fillStyle=m.block;rr(bgx,x+1.5,y+1.5,T-3,T-3,7);bgx.fill();
    bgx.fillStyle=m.blockTop;rr(bgx,x+4.5,y+4.5,T-9,10,5);bgx.fill();
    bgx.strokeStyle=INK;bgx.lineWidth=3;rr(bgx,x+1.5,y+1.5,T-3,T-3,7);bgx.stroke();
  }
  const g=bgx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);
  g.addColorStop(0,'rgba(34,35,59,0)');g.addColorStop(1,'rgba(34,35,59,.24)');
  bgx.fillStyle=g;bgx.fillRect(0,0,W,H);
}
function drawIceTile(c,gx,gy,rnd){
  const x=gx*T,y=gy*T;

/* ---------------- round / match flow ---------------- */

/* ---------------- stats ---------------- */
function bumpStat(team,key,n){
  if(!tanks[team]||!tanks[team].human)return;
  const p=prof(team);if(!p)return;
  p.stats[key]=(p.stats[key]|0)+(n||1);
}
function finishMatch(winner){
  if(matchDone)return;
  matchDone=true;
  const before=tanks.map(t=>t.human?unlockedCount(prof(t.team)):0);
  for(const t of tanks){
    if(!t.human)continue;
    const p=prof(t.team);
    p.last=t.clsIdx;
    p.stats.plays[t.cls.name]=(p.stats.plays[t.cls.name]|0)+1;
    if(t===winner)p.stats.wins++;else p.stats.losses++;
  }
  if(mode==='campaign'&&winner&&winner.human){
    const p=prof(0);
    if(campStage+1>p.stats.campaign)p.stats.campaign=campStage+1;
  }
  const gained=[];
  tanks.forEach((t,i)=>{
    if(!t.human)return;
    if(unlockedCount(prof(t.team))>before[i]){
      CLASSES.forEach((c,ci)=>{if(c.unlock&&isUnlocked(ci,prof(t.team))&&!gained.includes(c.name))gained.push(c.name)});
    }
  });
  if(gained.length){toast={txt:'UNLOCKED: '+gained[gained.length-1],life:260};sUnlock()}
  saveProfiles();
}

/* ---------------- firing ---------------- */
function fire(t){
  const g=GUNS[t.cls.gun],fx=t.fx;
  const maxLive=g.maxLive+(fx.triple>0?2:0);
  if(t.cd>0||t.fx.frozen>0||bullets.filter(b=>b.owner===t).length>=maxLive)return;
  let n=g.pellets||1,spread=g.spread||0;
  if(fx.triple>0){n=Math.max(3,n);spread=Math.max(.22,spread)}
  const dmg=g.dmg+(fx.big>0?1:0),br=g.br+(fx.big>0?3:0);
  const mo=t.cls.radius+t.cls.bl-4;
  for(let i=0;i<n;i++){
    const a=t.ang+(spread?(i-(n-1)/2)*spread:0)+(g.jitter?(Math.random()-.5)*g.jitter:0);
    bullets.push({x:t.x+Math.cos(a)*mo,y:t.y+Math.sin(a)*mo,px:0,py:0,
      vx:Math.cos(a)*g.spd,vy:Math.sin(a)*g.spd,owner:t,dmg,r:br,
      bounces:g.bounces||0,life:g.life||0,life0:g.life||0,gun:t.cls.gun,
      pierce:fx.pierce>0,phase:!!g.phase,air:!!g.air,aoe:g.aoe||0,tpCd:0});
  }
  t.cd=Math.round(g.cd*(fx.rapid>0?.5:1));t.recoil=g.br;
  burst(t.x+Math.cos(t.ang)*mo,t.y+Math.sin(t.ang)*mo,'#ffd166',4,2.5);
  SND[t.cls.gun]();
}

/* ---------------- AI ---------------- */
function losClear(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1),steps=Math.max(1,d/12|0);
  for(let i=1;i<steps;i++){
    const x=x1+(x2-x1)*i/steps,y=y1+(y2-y1)*i/steps;
    const c=cells[Math.max(0,Math.min(ROWS-1,y/T|0))][Math.max(0,Math.min(COLS-1,x/T|0))];
    if(c==='#'||c==='x')return false;
  }
  return true;
}
function dirBlocked(t,dx,dy){
  const r=t.cls.radius,probe=r+14;
  return !!hitCell(t.x+dx*probe,t.y+dy*probe,r*.9,'tank',dx,dy,false);
}
/* breadth-first flow field so bots route around walls instead of hugging them */
const bfsDist=new Int16Array(COLS*ROWS),bfsQueue=new Int16Array(COLS*ROWS);
function passable(gx,gy){
  const c=cells[gy][gx];
  return c!=='#'&&c!=='x'&&c!=='~';
}
function bfsStep(t,tx,ty){
  const sx=Math.max(0,Math.min(COLS-1,t.x/T|0)),sy=Math.max(0,Math.min(ROWS-1,t.y/T|0));
  let gx=Math.max(0,Math.min(COLS-1,tx/T|0)),gy=Math.max(0,Math.min(ROWS-1,ty/T|0));
  if(!passable(gx,gy)){
    let best=null,bd=1e9;
    for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
      if(!passable(x,y))continue;
      const d=(x-gx)*(x-gx)+(y-gy)*(y-gy);
      if(d<bd){bd=d;best=[x,y]}
    }
    if(!best)return null;
    gx=best[0];gy=best[1];
  }
  bfsDist.fill(-1);
  let head=0,tail=0;
  bfsDist[gy*COLS+gx]=0;bfsQueue[tail++]=gy*COLS+gx;
  while(head<tail){
    const k=bfsQueue[head++],kx=k%COLS,ky=(k/COLS)|0,d=bfsDist[k];
    if(kx===sx&&ky===sy)break;
    for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=kx+ox,ny=ky+oy;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      const nk=ny*COLS+nx;
      if(bfsDist[nk]!==-1||!passable(nx,ny))continue;
      bfsDist[nk]=d+1;bfsQueue[tail++]=nk;
    }
  }
  if(bfsDist[sy*COLS+sx]===-1)return null;
  let best=null,bd=bfsDist[sy*COLS+sx];
  for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=sx+ox,ny=sy+oy;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
    const nd=bfsDist[ny*COLS+nx];
    if(nd!==-1&&nd<bd){bd=nd;best=[nx,ny]}
  }
  if(!best)return null;
  return{x:best[0]*T+T/2-t.x,y:best[1]*T+T/2-t.y};
}
function aiInput(t){
  const cfg=t.ai,e=tanks[1-t.team],g=GUNS[t.cls.gun];
  const inp={dx:0,dy:0,fire:false};
  if(!e)return inp;
  t.aiTick++;
  const dx=e.x-t.x,dy=e.y-t.y,dist=Math.hypot(dx,dy)||1;
  const los=losClear(t.x,t.y,e.x,e.y);
  // aim: lead the target when the level is good enough
  let aim=Math.atan2(dy,dx);
  if(cfg.lead){
    const tof=dist/g.spd;
    const px=e.x+(e.mvx||0)*tof*.9,py=e.y+(e.mvy||0)*tof*.9;
    aim=Math.atan2(py-t.y,px-t.x);
  }
  if(t.aiTick%cfg.react===0)t.aimNoise=(Math.random()-.5)*cfg.aimErr*2;
  aim+=t.aimNoise||0;
  // steering target
  let tx=e.x,ty=e.y;
  if(cfg.seek){
    let best=null,bd=260;
    for(const p of pickups){const d=Math.hypot(p.x-t.x,p.y-t.y);if(d<bd){bd=d;best=p}}
    if(best){tx=best.x;ty=best.y}
  }
  const ideal=g.range*.55;
  const targetIsEnemy=(tx===e.x&&ty===e.y);
  let wantX=tx-t.x,wantY=ty-t.y;
  const openShot=targetIsEnemy&&los&&dist<g.range*.95;
  if(openShot){
    // in a firefight: hold range and strafe
    const rad=Math.hypot(wantX,wantY)||1;
    const ux=wantX/rad,uy=wantY/rad;
    const closeErr=(dist-ideal)/ideal;
    const strafe=Math.sin(frame*.02+t.team*3)*1.1;
    wantX=ux*closeErr*2+(-uy)*strafe;
    wantY=uy*closeErr*2+( ux)*strafe;
  }else{
    // no shot: route around the level with a flow field, refreshed periodically
    if(t.aiTick%12===0||!t.aiPath)t.aiPath=bfsStep(t,tx,ty);
    if(t.aiPath){wantX=t.aiPath.x;wantY=t.aiPath.y}
  }
  // dodge incoming fire
  if(Math.random()<cfg.dodge){
    for(const b of bullets){
      if(b.owner===t)continue;
      const bd=Math.hypot(b.x-t.x,b.y-t.y);
      if(bd>170)continue;
      const toward=(t.x-b.x)*b.vx+(t.y-b.y)*b.vy;
      if(toward<=0)continue;
      wantX=-b.vy;wantY=b.vx;
      break;
    }
  }
  let wl=Math.hypot(wantX,wantY)||1;
  let wx=wantX/wl,wy=wantY/wl;
  // unstick: if barely moving, commit to a free direction for a while
  if(t.aiTick%20===0){
    const moved=Math.hypot(t.x-(t.aiLastX||0),t.y-(t.aiLastY||0));
    t.aiLastX=t.x;t.aiLastY=t.y;
    if(moved<6&&t.aiPanic<=0){
      t.aiPanic=36;
      const opts=[];
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2;
        if(!dirBlocked(t,Math.cos(a),Math.sin(a)))opts.push([Math.cos(a),Math.sin(a)])}
      t.aiPanicDir=opts.length?opts[Math.random()*opts.length|0]:[-wx,-wy];
      t.aiPath=null;
    }
  }
  if(t.aiPanic>0){t.aiPanic--;wx=t.aiPanicDir[0];wy=t.aiPanicDir[1]}
  else if(dirBlocked(t,wx,wy)){
    let best=null,bs=-9;
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2,cxv=Math.cos(a),cyv=Math.sin(a);
      if(dirBlocked(t,cxv,cyv))continue;
      const s=cxv*wx+cyv*wy;
      if(s>bs){bs=s;best=[cxv,cyv]}
    }
    if(best){wx=best[0];wy=best[1]}
  }
  inp.dx=wx;inp.dy=wy;
  // face + fire
  t.ang=lerpAngle(t.ang,aim,cfg.react<=3?.28:.16);
  let err=aim-t.ang;
  while(err>Math.PI)err-=2*Math.PI;while(err<-Math.PI)err+=2*Math.PI;
  const canSee=g.air?dist<g.range:los;
  if(t.aiFireLock>0)t.aiFireLock--;
  if(canSee&&Math.abs(err)<cfg.aimTol&&dist<g.range&&t.aiFireLock<=0){
    inp.fire=true;
    if(cfg.fireGap)t.aiFireLock=cfg.fireGap;
  }
  inp.face=aim;
  return inp;
}
function humanInput(t){
  if(t.netLocal){ // online: your machine, so both control schemes drive your tank
    let dx=0,dy=0,f=false;
    for(const k of KEYMAP){
      dx+=(keys[k.right]?1:0)-(keys[k.left]?1:0);
      dy+=(keys[k.down]?1:0)-(keys[k.up]?1:0);
      f=f||!!keys[k.fire];
    }
    return{dx:Math.max(-1,Math.min(1,dx)),dy:Math.max(-1,Math.min(1,dy)),fire:f};
  }
  const k=KEYMAP[t.team];
  return{dx:(keys[k.right]?1:0)-(keys[k.left]?1:0),
         dy:(keys[k.down]?1:0)-(keys[k.up]?1:0),
         fire:!!keys[k.fire]};
}

/* ---------------- tank control ---------------- */
function controlTank(t){
  const fx=t.fx;
  let inp=t.ai?aiInput(t):(t.remote?(t.netInput||{dx:0,dy:0,fire:false}):humanInput(t));
  for(const key in fx)if(fx[key]>0)fx[key]--;
  if(fx.ghost===1&&hitCell(t.x,t.y,t.cls.radius,'tank',0,0,false)){const p=nearestFree(t.x,t.y);t.x=p.x;t.y=p.y}
  let dx=inp.dx,dy=inp.dy;
  if(fx.reverse>0){dx=-dx;dy=-dy}
  if(fx.frozen>0){dx=0;dy=0}
  const tile=tileAt(t.x,t.y);
  const spd=t.cls.speed*(fx.speed>0?1.45:1)*(t.ai?t.ai.speedMul:1);
  let ddx=0,ddy=0;
  if(dx||dy){
    const len=Math.hypot(dx,dy);ddx=dx/len*spd;ddy=dy/len*spd;
    if(!t.ai)t.ang=lerpAngle(t.ang,Math.atan2(dy,dx),.3);
  }
  if(tile==='*'){t.mvx=t.mvx*.93+ddx*.1;t.mvy=t.mvy*.93+ddy*.1}
  else{t.mvx=ddx;t.mvy=ddy}
  let bx=0,by=0;
  if(tile==='>')bx=1.4;else if(tile==='<')bx=-1.4;
  else if(tile==='v')by=1.4;else if(tile==='^')by=-1.4;
  tryMove(t,t.mvx+t.ivx+bx,t.mvy+t.ivy+by);
  const ice=tile==='*';
  t.ivx*=ice?.96:.86;t.ivy*=ice?.96:.86;
  t.dist+=Math.hypot(t.mvx+bx,t.mvy+by);
  if((t.mvx||t.mvy)&&frame%3===0&&tile!=='b')marks.push({x:t.x,y:t.y,ang:t.ang,life:170,r:t.cls.radius});
  const gx0=Math.max(0,(t.x-60)/T|0),gx1=Math.min(COLS-1,(t.x+60)/T|0);
  const gy0=Math.max(0,(t.y-60)/T|0),gy1=Math.min(ROWS-1,(t.y+60)/T|0);
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){
    if(cells[gy][gx]!=='o')continue;
    const cxp=gx*T+T/2,cyp=gy*T+T/2,d=Math.hypot(t.x-cxp,t.y-cyp);
    if(d<t.cls.radius+13&&d>0){
      t.ivx=(t.x-cxp)/d*7.5;t.ivy=(t.y-cyp)/d*7.5;
      sBoing();burst(cxp,cyp,'#ef3e4a',5,3);
    }
  }
  if(t.tpCd>0)t.tpCd--;
  const tp=tileAt(t.x,t.y);
  if((tp==='1'||tp==='2')&&t.tpCd<=0){
    const pair=portals[tp];
    const here=pair.find(p=>p.gx===(t.x/T|0)&&p.gy===(t.y/T|0));
    const other=pair.find(p=>p!==here);
    if(other){burst(t.x,t.y,'#7ae0c3',12,4);t.x=other.gx*T+T/2;t.y=other.gy*T+T/2;
      t.tpCd=70;burst(t.x,t.y,'#7ae0c3',12,4);sTele()}
  }
  if(t.cd>0)t.cd--;
  if(t.inv>0)t.inv--;
  if(t.recoil>0)t.recoil-=1.2;
  if(t.starCd>0)t.starCd--;
  if(t.crushCd>0)t.crushCd--;
  if(t.minesToLay>0){
    if(t.mineCd>0)t.mineCd--;
    else{mines.push({x:t.x,y:t.y,owner:t,arm:30,life:900});t.minesToLay--;t.mineCd=40;sMine()}
  }
  if(inp.fire)fire(t);
}
function tankCollide(){
  const [a,b]=tanks;
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.cls.radius+b.cls.radius;
  if(d>0&&d<min){
    const push=(min-d)/2,ux=dx/d,uy=dy/d;
    tryMove(a,-ux*push,-uy*push);
    tryMove(b,ux*push,uy*push);
    for(const [s,o] of [[a,b],[b,a]]){
      if(s.fx.star>0&&o.fx.star<=0&&o.inv<=0&&s.starCd<=0){
        s.starCd=30;damage(o,1,Math.atan2(o.y-s.y,o.x-s.x),12);
      }
    }
  }
  for(const t of tanks){
    const mv=moverHit(t.x,t.y,t.cls.radius);
    if(mv){
      const rc=moverRect(mv);
      const pushx=rc.vx*2||(t.x<rc.x+rc.w/2?-3:3),pushy=rc.vy*2||(t.y<rc.y+rc.h/2?-3:3);
      tryMove(t,pushx,pushy);
      if(moverHit(t.x,t.y,t.cls.radius)&&t.crushCd<=0&&t.inv<=0){
        t.crushCd=60;damage(t,1,Math.atan2(pushy,pushx),10);
      }
    }
  }
}

/* ---------------- damage ---------------- */
function damage(t,dmg,fromAng,knock){
  if(t.fx.star>0)return;
  if(t.shield>0){t.shield--;burst(t.x,t.y,'#3d7ea6',10,3);sBounce();addFloat(t.x,t.y-24,'BLOCKED','#3d7ea6');return}
  t.hp-=dmg;t.inv=BULLET_INVUL;shake=Math.max(shake,5+dmg*2);hitstop=Math.max(hitstop,3);sHit();
  burst(t.x,t.y,t.cls.color,10,3.5);
  tryMove(t,Math.cos(fromAng)*knock,0);tryMove(t,0,Math.sin(fromAng)*knock);
  if(t.hp<=0){
    roundWinner=tanks[1-t.team];roundWinner.score++;
    bumpStat(roundWinner.team,'kos');bumpStat(0,'rounds');bumpStat(1,'rounds');
    ko={x:t.x,y:t.y};
    burst(t.x,t.y,t.cls.color,26,6);burst(t.x,t.y,'#ffd166',18,5);
    shake=14;hitstop=8;sKO();state='round';timer=140;
  }
}
function explode(x,y,radius,dmg,owner){
  burst(x,y,'#ffd166',20,5);burst(x,y,'#ff8c42',14,4);shake=Math.max(shake,8);sBoom();
  for(const t of tanks){
    if(t===owner||t.inv>0)continue;
    if(Math.hypot(t.x-x,t.y-y)<radius+t.cls.radius)damage(t,dmg,Math.atan2(t.y-y,t.x-x),12);
    if(state!=='play')return;
  }
  for(const k in crateHp){
    if(crateHp[k]<=0)continue;
    const gx=k%COLS,gy=(k/COLS)|0;
    if(cells[gy][gx]==='x'&&Math.hypot(gx*T+T/2-x,gy*T+T/2-y)<radius+T/2)damageCrate(gx,gy,2);
  }
}
function damageCrate(gx,gy,dmg){
  const k=gy*COLS+gx;
  crateHp[k]-=dmg;sCrate();
  burst(gx*T+T/2,gy*T+T/2,'#c08a4a',8,3);
  if(crateHp[k]<=0){cells[gy][gx]='.';burst(gx*T+T/2,gy*T+T/2,'#8f5f2c',14,4.5);shake=Math.max(shake,4)}
}

/* ---------------- powerups ---------------- */
function spawnPickup(){
  for(let tries=0;tries<40;tries++){
    const gx=1+(Math.random()*(COLS-2)|0),gy=1+(Math.random()*(ROWS-2)|0);
    if(cells[gy][gx]!=='.')continue;
    const x=gx*T+T/2,y=gy*T+T/2;
    if(tanks.some(t=>Math.hypot(t.x-x,t.y-y)<150))continue;
    if(pickups.some(p=>Math.hypot(p.x-x,p.y-y)<120))continue;
    pickups.push({x,y,def:POWERS[Math.random()*POWERS.length|0],age:0});
    return;
  }
}
function applyPower(t,def){
  const e=tanks[1-t.team];
  sPick();addFloat(t.x,t.y-28,def.label,def.color);
  if(def.id==='heal')t.hp=Math.min(t.maxHp,t.hp+2);
  else if(def.id==='shield')t.shield=2;
  else if(def.id==='mine')t.minesToLay=3;
  else if(def.id==='freeze'){e.fx.frozen=90;sFrz();burst(e.x,e.y,'#4c93d9',14,4);addFloat(e.x,e.y-28,'FROZEN!','#4c93d9')}
  else if(def.id==='flip'){e.fx.reverse=360;addFloat(e.x,e.y-28,'FLIPPED!','#ff8c42')}
  else t.fx[def.id]=def.dur;
}

/* ---------------- play step ---------------- */
function stepPlay(){
  tanks.forEach(controlTank);
  tankCollide();
  pickupClock--;
  if(pickupClock<=0){pickupClock=300;if(pickups.length<2)spawnPickup()}
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];p.age++;
    if(p.age>720){pickups.splice(i,1);continue}
    for(const t of tanks){
      if(Math.hypot(t.x-p.x,t.y-p.y)<t.cls.radius+14){applyPower(t,p.def);pickups.splice(i,1);break}
    }
  }
  for(let i=mines.length-1;i>=0;i--){
    const mn=mines[i];
    if(mn.arm>0)mn.arm--;
    if(--mn.life<=0){mines.splice(i,1);continue}
    if(mn.arm<=0){
      const e=tanks[1-mn.owner.team];
      if(e.inv<=0&&Math.hypot(e.x-mn.x,e.y-mn.y)<e.cls.radius+9){
        mines.splice(i,1);explode(mn.x,mn.y,30,1,mn.owner);
        if(state!=='play')return;
      }
    }
  }
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.life&&--b.life<=0){
      if(b.air)explode(b.x+b.vx,b.y+b.vy,b.aoe,b.dmg,b.owner);
      bullets.splice(i,1);
      if(state!=='play')return;
      continue;
    }
    if(b.air){b.px=b.x;b.py=b.y;b.x+=b.vx;b.y+=b.vy;continue}
    if(b.tpCd>0)b.tpCd--;
    const bt=tileAt(b.x,b.y);
    if((bt==='1'||bt==='2')&&b.tpCd<=0){
      const pair=portals[bt];
      const here=pair.find(p=>p.gx===(b.x/T|0)&&p.gy===(b.y/T|0));
      const other=pair.find(p=>p!==here);
      if(other){b.x=other.gx*T+T/2;b.y=other.gy*T+T/2;b.tpCd=30;burst(b.x,b.y,'#7ae0c3',4,2)}
    }
    if(bt==='o'){
      const gx=(b.x/T|0),gy=(b.y/T|0),cxp=gx*T+T/2,cyp=gy*T+T/2;
      const d=Math.hypot(b.x-cxp,b.y-cyp);
      if(d<13+b.r&&d>0){
        const ux=(b.x-cxp)/d,uy=(b.y-cyp)/d,dot=b.vx*ux+b.vy*uy;
        if(dot<0){b.vx-=2*dot*ux;b.vy-=2*dot*uy;sBounce()}
      }
    }
    const gh=b.phase;
    const hx=hitCell(b.x+b.vx,b.y,b.r,'bullet',b.vx,0,gh);
    const hy=hitCell(b.x,b.y+b.vy,b.r,'bullet',0,b.vy,gh);
    let hb=hx||hy||hitCell(b.x+b.vx,b.y+b.vy,b.r,'bullet',b.vx,b.vy,gh);
    const mv=moverHit(b.x+b.vx,b.y+b.vy,b.r);
    if(hb&&hb.c==='x'&&b.pierce){damageCrate(hb.gx,hb.gy,b.dmg);hb=null}
    if(hb||mv){
      if(hb&&hb.c==='x'){damageCrate(hb.gx,hb.gy,b.dmg);burst(b.x,b.y,'#ffd166',6,2.5);bullets.splice(i,1);continue}
      if(b.bounces>0){
        b.bounces--;
        if(hx||(mv&&Math.abs(b.vx)>Math.abs(b.vy)))b.vx=-b.vx;
        if(hy||(mv&&Math.abs(b.vy)>=Math.abs(b.vx)))b.vy=-b.vy;
        if(!hx&&!hy&&!mv){b.vx=-b.vx;b.vy=-b.vy}
        sBounce();burst(b.x,b.y,'#7ae0c3',3,2);
      }else{burst(b.x,b.y,'#ffd166',6,2.5);bullets.splice(i,1);continue}
    }
    b.px=b.x;b.py=b.y;b.x+=b.vx;b.y+=b.vy;
    let gone=false;
    for(const t of tanks){
      if(t===b.owner||t.inv>0)continue;
      const rr2=(t.cls.radius+b.r)*(t.cls.radius+b.r);
      if((b.x-t.x)*(b.x-t.x)+(b.y-t.y)*(b.y-t.y)<rr2){
        bullets.splice(i,1);gone=true;
        damage(t,b.dmg,Math.atan2(b.vy,b.vx),GUNS[b.gun].knock);
        break;
      }
    }
    if(state!=='play')return;
    if(gone)continue;
    for(let j=mines.length-1;j>=0;j--){
      if(Math.hypot(b.x-mines[j].x,b.y-mines[j].y)<b.r+9){
        burst(mines[j].x,mines[j].y,'#5d3d16',8,3);mines.splice(j,1);
        bullets.splice(i,1);break;
      }
    }
  }
}
/* ---------------- menus ---------------- */
function goto(s){state=s;pressQ.clear()}
function participants(){return mode==='coop'?2:1}  // online picks locally on each machine
function stepTitle(){if(navOk()){sGo();menuIdx=0;goto('mode')}}
function stepMode(){
  if(navUp()){menuIdx=(menuIdx+MODES.length-1)%MODES.length;sTick()}
  if(navDown()){menuIdx=(menuIdx+1)%MODES.length;sTick()}
  if(navBack()){sBack();goto('title')}
  if(navOk()){
    const id=MODES[menuIdx].id;sLock();
    if(id==='profiles'){profTeam=0;profField=0;goto('profiles')}
    else if(id==='duel'){mode='duel';subIdx=aiLevel;goto('difficulty')}
    else if(id==='campaign'){
      mode='campaign';campStage=Math.min(prof(0).stats.campaign|0,MAPS.length-1);
      subIdx=campStage;goto('campmenu');
    }
    else if(id==='online'){mode='online';goto('online')}
    else{mode='coop';enterSelect()}
  }
}
function stepDifficulty(){
  if(navLeft()||navUp()){subIdx=(subIdx+2)%3;sTick()}
  if(navRight()||navDown()){subIdx=(subIdx+1)%3;sTick()}
  if(navBack()){sBack();goto('mode')}
  if(navOk()){aiLevel=subIdx;sLock();enterSelect()}
}
function stepCampMenu(){
  const maxStage=Math.min(prof(0).stats.campaign|0,MAPS.length-1);
  if(navLeft()){subIdx=Math.max(0,subIdx-1);sTick()}
  if(navRight()){subIdx=Math.min(maxStage,subIdx+1);sTick()}
  if(navBack()){sBack();goto('mode')}
  if(navOk()){campStage=subIdx;sLock();enterSelect()}
}
function enterSelect(){
  for(let p=0;p<2;p++){
    sel[p].locked=false;
    const pr=prof(p);
    if(pr&&isUnlocked(pr.last,pr))sel[p].i=pr.last;
  }
  if(mode==='duel'){
    // the bot picks a class of its own
    let pick=Math.random()*CLASSES.length|0;
    sel[1].i=pick;
  }
  selTimer=50;goto('select');
}
function stepSelect(){
  const n=participants();
  for(let p=0;p<n;p++){
    const k=KEYMAP[p],s=sel[p],pr=prof(p);
    if(!s.locked){
      let col=s.i%3,row=(s.i/3)|0,moved=false;
      if(pressQ.has(k.left)){col=(col+2)%3;moved=true}
      if(pressQ.has(k.right)){col=(col+1)%3;moved=true}
      if(pressQ.has(k.up)){row=(row+2)%3;moved=true}
      if(pressQ.has(k.down)){row=(row+1)%3;moved=true}
      if(moved){s.i=row*3+col;sTick()}
      if(pressQ.has(k.fire)){
        if(isUnlocked(s.i,pr)){s.locked=true;sLock();if(onLockIn)onLockIn(p)}
        else{toast={txt:'LOCKED · '+CLASSES[s.i].unlock.txt,life:150};sBack()}
      }
    }else if(pressQ.has(k.fire)&&!allLocked()){
      s.locked=false;sTick();
    }
  }
  if(navBack()&&!allLocked()){sBack();goto('mode');return}
  if(allLocked()){
    if(netBlockStart&&netBlockStart())selTimer=50;
    else if(--selTimer<=0)startMatch();
  }else selTimer=50;
}
function allLocked(){
  const n=participants();
  for(let p=0;p<n;p++)if(!sel[p].locked)return false;
  return true;
}
function stepProfiles(){
  const p=profiles[slots[profTeam]];
  if(navBack()){sBack();saveProfiles();goto('mode');return}
  if(pressQ.has('Tab')||anyPress('KeyQ')){profTeam=1-profTeam;sTick()}
  if(navUp()){profField=(profField+3)%4;sTick()}
  if(navDown()){profField=(profField+1)%4;sTick()}
  if(profField===0){ // which profile slot
    if(navLeft()){slots[profTeam]=(slots[profTeam]+profiles.length-1)%profiles.length;sTick();saveProfiles()}
    if(navRight()){slots[profTeam]=(slots[profTeam]+1)%profiles.length;sTick();saveProfiles()}
  }else if(profField===1){ // colour
    const ci=Math.max(0,SWATCHES.indexOf(p.color));
    if(navLeft()){p.color=SWATCHES[(ci+SWATCHES.length-1)%SWATCHES.length];sTick();saveProfiles()}
    if(navRight()){p.color=SWATCHES[(ci+1)%SWATCHES.length];sTick();saveProfiles()}
  }
  if(navOk()){
    if(profField===2){nameTarget=slots[profTeam];typeBuf=p.name;sLock();goto('name')}
    else if(profField===3){
      profiles.push(blankProfile('PLAYER '+(profiles.length+1)));
      slots[profTeam]=profiles.length-1;profField=2;sLock();saveProfiles();
    }else sLock();
  }
}
function stepName(){
  if(pressQ.has('Enter')||pressQ.has('Escape')){
    const nm=typeBuf.trim();
    if(nm)profiles[nameTarget].name=nm.slice(0,12);
    saveProfiles();sLock();goto('profiles');
  }
}
function stepOnline(){
  if(navBack()||navOk()){sBack();goto('mode')}
}
function stepRoundEnd(){
  if(--timer>0)return;
  const champ=roundWinner&&roundWinner.score>=(mode==='campaign'?1:WIN_SCORE);
  if(champ){
    finishMatch(roundWinner);
    if(mode==='campaign'){
      campResult=roundWinner.human?'CLEARED':'FAILED';
      if(roundWinner.human&&campStage+1>=MAPS.length)campResult='COMPLETE';
    }
    state='game';timer=30;sStar();conf=[];
  }else{
    mapIndex=(mapIndex+1)%MAPS.length;startRound();
  }
}
function stepGameOver(){
  if(timer>0)timer--;
  else if(navOk()){
    if(mode==='campaign'){
      if(campResult==='CLEARED'){campStage=Math.min(campStage+1,MAPS.length-1);sGo();startMatch();return}
      if(campResult==='FAILED'){sGo();startMatch();return}
      sGo();goto('mode');return;
    }
    sGo();enterSelect();
  }
  if(navBack()){sBack();goto('mode')}
  if(conf.length<160&&frame%2===0){
    const cols=['#ef3e4a','#35a44a','#ffd23f','#3d7ea6','#ff8c42','#2ec4b6'];
    conf.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*1.5,vy:1.5+Math.random()*2,
      rot:Math.random()*6,vr:(Math.random()-.5)*.25,color:cols[Math.random()*6|0],w:6+Math.random()*5,h:4+Math.random()*4});
  }
  for(let i=conf.length-1;i>=0;i--){const c=conf[i];c.x+=c.vx;c.y+=c.vy;c.rot+=c.vr;if(c.y>H+12)conf.splice(i,1)}
}
function stepAmbient(){
  for(const a of amb){
    a.p+=.02;
    if(a.kind==='snow'){a.y+=.5*a.s;a.x+=Math.sin(a.p)*.4;if(a.y>H){a.y=-4;a.x=Math.random()*W}}
    else if(a.kind==='embers'){a.y-=.6*a.s;a.x+=Math.sin(a.p)*.5;if(a.y<-4){a.y=H+4;a.x=Math.random()*W}}
    else if(a.kind==='clouds'){a.x+=.25*a.s;if(a.x>W+160)a.x=-160}
    else if(a.kind==='heat'){a.y-=.3*a.s;if(a.y<-10){a.y=H+10;a.x=Math.random()*W}}
    else if(a.kind==='sparks'&&Math.random()<.02){a.x=Math.random()*W;a.y=Math.random()*H}
  }
}
function step(){
  frame++;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.92;p.vy*=.92;if(--p.life<=0)parts.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y-=.7;if(--f.life<=0)floats.splice(i,1)}
  for(let i=marks.length-1;i>=0;i--){if(--marks[i].life<=0)marks.splice(i,1)}
  if(marks.length>240)marks.splice(0,marks.length-240);
  if(toast&&--toast.life<=0)toast=null;
  if(shake>0)shake*=.86;
  stepAmbient();
  if(hitstop>0){hitstop--;pressQ.clear();return}
  if(state==='title')stepTitle();
  else if(state==='mode')stepMode();
  else if(state==='difficulty')stepDifficulty();
  else if(state==='campmenu')stepCampMenu();
  else if(state==='profiles')stepProfiles();
  else if(state==='name')stepName();
  else if(state==='online')stepOnline();
  else if(state==='select')stepSelect();
  else if(state==='ready'){
    if(!readyPinged){sTick();readyPinged=true}
    if(timer===40&&!goPinged){sGo();goPinged=true}
    if(--timer<=0)state='play';
  }
  else if(state==='play')stepPlay();
  else if(state==='round')stepRoundEnd();
  else if(state==='game')stepGameOver();
  pressQ.clear();
}

/* ---------------- dynamic tile drawing ---------------- */
function drawDynamicTiles(){
  const m=MAPS[mapIndex];
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){
    const c=cells[gy][gx],x=gx*T,y=gy*T;
    if(c==='>'||c==='<'||c==='^'||c==='v'){
      cx.fillStyle='#2e3147';rr(cx,x+2,y+2,T-4,T-4,5);cx.fill();
      cx.strokeStyle=INK;cx.lineWidth=2;rr(cx,x+2,y+2,T-4,T-4,5);cx.stroke();
      const dir=c==='>'?0:c==='v'?Math.PI/2:c==='<'?Math.PI:-Math.PI/2;
      cx.save();cx.translate(x+T/2,y+T/2);cx.rotate(dir);
      const ph=(frame*.8)%14;
      cx.strokeStyle='#ffb703';cx.lineWidth=3;cx.lineJoin='round';
      for(let i=-1;i<2;i++){
        const px=-14+ph+i*14;
        cx.beginPath();cx.moveTo(px-4,-9);cx.lineTo(px+4,0);cx.lineTo(px-4,9);cx.stroke();
      }
      cx.restore();
    }else if(c==='~'){
      const ph=frame*.05+gx*.9+gy*.7;
      cx.strokeStyle=m.liqB;cx.lineWidth=2.5;
      cx.beginPath();cx.arc(x+12+Math.sin(ph)*3,y+14,6,Math.PI*.15,Math.PI*.85);cx.stroke();
      cx.beginPath();cx.arc(x+28+Math.cos(ph)*3,y+28,6,Math.PI*.15,Math.PI*.85);cx.stroke();
      if(m.world==='volcano'&&Math.random()<.004)burst(x+Math.random()*T,y+Math.random()*T,'#ffd166',1,1.5);
    }else if(c==='o'){
      const cxp=x+T/2,cyp=y+T/2;
      cx.fillStyle='#ef3e4a';cx.beginPath();cx.arc(cxp,cyp,13,0,Math.PI*2);cx.fill();
      cx.strokeStyle=INK;cx.lineWidth=3;cx.stroke();
      cx.fillStyle=CREAM;cx.beginPath();cx.arc(cxp,cyp,6.5,0,Math.PI*2);cx.fill();cx.stroke();
    }else if(c==='1'||c==='2'){
      const cxp=x+T/2,cyp=y+T/2,col=c==='1'?'#7ae0c3':'#ffb703';
      cx.save();cx.translate(cxp,cyp);cx.rotate(frame*.04*(c==='1'?1:-1));
      cx.strokeStyle=col;cx.lineWidth=3.5;
      for(let i=0;i<3;i++){cx.beginPath();cx.arc(0,0,12,i*2.1,i*2.1+1.3);cx.stroke()}
      cx.restore();
      cx.fillStyle=col;cx.globalAlpha=.35+.2*Math.sin(frame*.1);
      cx.beginPath();cx.arc(cxp,cyp,6,0,Math.PI*2);cx.fill();cx.globalAlpha=1;
    }
  }
}
function drawBushes(){
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){
    if(cells[gy][gx]!=='b')continue;
    const x=gx*T+T/2,y=gy*T+T/2,sw=1+Math.sin(frame*.04+gx*2+gy)*0.04;
    cx.save();cx.translate(x,y);cx.scale(sw,1);
    cx.fillStyle='#2f9e44';

    cx.strokeStyle=INK;cx.lineWidth=2.5;cx.stroke();
    cx.fillStyle='#4bbf5e';
    cx.beginPath();cx.arc(-6,-4,5,0,Math.PI*2);cx.arc(7,-1,4,0,Math.PI*2);cx.fill();
    cx.restore();
  }
}
function drawCrates(){
  for(const k in crateHp){
    if(crateHp[k]<=0)continue;
    const gx=k%COLS,gy=(k/COLS)|0;
    if(cells[gy][gx]!=='x')continue;

    cx.fillStyle='#c08a4a';rr(cx,x+2.5,y+2.5,T-5,T-5,6);cx.fill();
    cx.strokeStyle='#8f5f2c';cx.lineWidth=3;
    cx.beginPath();cx.moveTo(x+7,y+7);cx.lineTo(x+T-7,y+T-7);cx.moveTo(x+T-7,y+7);cx.lineTo(x+7,y+T-7);cx.stroke();
    cx.strokeStyle=INK;cx.lineWidth=3;rr(cx,x+2.5,y+2.5,T-5,T-5,6);cx.stroke();
    if(hp<2){cx.strokeStyle='#5d3d16';cx.lineWidth=2;
      cx.beginPath();cx.moveTo(x+6,y+14);cx.lineTo(x+14,y+18);cx.lineTo(x+10,y+27);cx.moveTo(x+30,y+8);cx.lineTo(x+26,y+18);cx.stroke()}
  }
}
function drawMovers(){
  for(const mv of movers){
    const rc=moverRect(mv);
    cx.fillStyle='rgba(34,35,59,.28)';rr(cx,rc.x+4,rc.y+5,rc.w-2,rc.h-2,7);cx.fill();
    cx.fillStyle='#6b6f8c';rr(cx,rc.x+1,rc.y+1,rc.w-2,rc.h-2,6);cx.fill();
    cx.save();cx.beginPath();rr(cx,rc.x+1,rc.y+1,rc.w-2,rc.h-2,6);cx.clip();
    cx.fillStyle='#ffb703';
    for(let i=-1;i<3;i++){
      cx.save();cx.translate(rc.x+i*16+8,rc.y+rc.h/2);cx.rotate(-.7);
      cx.fillRect(-4,-30,8,60);cx.restore();
    }
    cx.restore();
    cx.strokeStyle=INK;cx.lineWidth=3;rr(cx,rc.x+1,rc.y+1,rc.w-2,rc.h-2,6);cx.stroke();
  }
}
function drawMinesAndPickups(){
  for(const mn of mines){
    const armed=mn.arm<=0,blink=armed&&(frame>>4)%2===0;
    cx.fillStyle=armed?'#454458':'#8a8672';
    cx.beginPath();cx.arc(mn.x,mn.y,8,0,Math.PI*2);cx.fill();
    cx.strokeStyle=INK;cx.lineWidth=2.5;cx.stroke();
    cx.fillStyle=blink?'#ef3e4a':'#8f5f2c';
    cx.beginPath();cx.arc(mn.x,mn.y,3,0,Math.PI*2);cx.fill();
  }
  for(const p of pickups){
    const bob=Math.sin((frame+p.age)*.08)*3,fade=p.age>600&&(frame>>3)%2===0;
    if(fade)continue;
    const y=p.y+bob;
    cx.fillStyle='rgba(34,35,59,.2)';cx.beginPath();cx.ellipse(p.x,p.y+14,10,4,0,0,Math.PI*2);cx.fill();
    cx.fillStyle=CREAM;cx.beginPath();cx.arc(p.x,y,13,0,Math.PI*2);cx.fill();
    cx.strokeStyle=INK;cx.lineWidth=3;cx.stroke();
    cx.strokeStyle=p.def.color;cx.lineWidth=2.5;cx.beginPath();cx.arc(p.x,y,9.5,0,Math.PI*2);cx.stroke();
    cx.fillStyle=p.def.color;cx.font='900 12px system-ui,Arial,sans-serif';
    cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.def.glyph,p.x,y+1);
  }
}
function drawAmbient(){
  for(const a of amb){
    if(a.kind==='snow'){cx.fillStyle='rgba(255,255,255,.7)';cx.beginPath();cx.arc(a.x,a.y,1.6*a.s,0,Math.PI*2);cx.fill()}
    else if(a.kind==='embers'){cx.fillStyle='rgba(255,140,66,'+(.3+.3*Math.sin(a.p*3))+')';cx.beginPath();cx.arc(a.x,a.y,1.8*a.s,0,Math.PI*2);cx.fill()}
    else if(a.kind==='clouds'){cx.fillStyle='rgba(34,35,59,.05)';cx.beginPath();cx.ellipse(a.x,a.y,90*a.s,34*a.s,0,0,Math.PI*2);cx.fill()}
    else if(a.kind==='heat'){cx.fillStyle='rgba(255,255,255,.045)';cx.beginPath();cx.ellipse(a.x,a.y,26,7,0,0,Math.PI*2);cx.fill()}
    else if(a.kind==='sparks'){cx.fillStyle='rgba(255,183,3,'+(.25+.45*Math.abs(Math.sin(a.p*5)))+')';cx.fillRect(a.x,a.y,2,2)}
  }
}
function drawMarks(){
  for(const mk of marks){
    cx.save();cx.translate(mk.x,mk.y);cx.rotate(mk.ang);
    cx.globalAlpha=mk.life/170*.13;cx.fillStyle=INK;
    cx.fillRect(-2,-mk.r*.85,4,5);cx.fillRect(-2,mk.r*.85-5,4,5);
    cx.restore();
  }
  cx.globalAlpha=1;
}
/* ---------------- tank drawing ---------------- */
function drawTankBody(o){
  const c=o.cls,r=c.radius,rec=Math.max(0,o.recoil||0),fx=o.fx;
  const ghost=fx&&fx.ghost>0;
  if(ghost)cx.globalAlpha=.45;
  cx.fillStyle='rgba(34,35,59,.22)';
  cx.beginPath();cx.ellipse(o.x+3,o.y+5,r*1.15,r*.95,0,0,Math.PI*2);cx.fill();
  cx.save();cx.translate(o.x,o.y);cx.rotate(o.ang);
  cx.lineWidth=3;cx.strokeStyle=INK;
  // treads with animated notches
  const ph=((o.dist||0)*.9)%7;
  for(const side of [-1,1]){
    const ty=side<0?-r*1.16:r*.54;
    cx.fillStyle=c.dark;rr(cx,-r*1.05,ty,r*2.1,r*.62,4);cx.fill();cx.stroke();
    cx.strokeStyle='rgba(34,35,59,.55)';cx.lineWidth=2;
    for(let n=-r;n<r;n+=7){cx.beginPath();cx.moveTo(n+ph-3.5,ty+2);cx.lineTo(n+ph-3.5,ty+r*.62-2);cx.stroke()}
    cx.strokeStyle=INK;cx.lineWidth=3;
  }
  // hull + top plate + rivets
  cx.fillStyle=c.color;rr(cx,-r,-r*.74,r*2,r*1.48,7);cx.fill();cx.stroke();
  cx.fillStyle='rgba(255,255,255,.22)';rr(cx,-r*.8,-r*.6,r*1.6,r*.42,5);cx.fill();
  cx.fillStyle='rgba(34,35,59,.5)';
  for(const [rx,ry] of [[-r*.72,-r*.5],[r*.62,-r*.5],[-r*.72,r*.36],[r*.62,r*.36]]){
    cx.beginPath();cx.arc(rx,ry,1.8,0,Math.PI*2);cx.fill();
  }
  cx.fillStyle=c.dark;rr(cx,-r-3,-4,5,8,2);cx.fill();cx.stroke(); // exhaust
  if(c.skin==='titan'){cx.lineWidth=2.5;rr(cx,-r*.62,-r*.46,r*1.24,r*.92,5);cx.stroke();cx.lineWidth=3}
  if(c.skin==='phantom'){cx.fillStyle='rgba(255,255,255,.3)';rr(cx,-r*.9,-2.5,r*.5,5,2);cx.fill()}
  // barrels per skin
  cx.fillStyle=c.dark;
  if(c.skin==='scout'){
    rr(cx,4-rec,-7.5,c.bl+r-8,4.5,2);cx.fill();cx.stroke();
    rr(cx,4-rec,3,c.bl+r-8,4.5,2);cx.fill();cx.stroke();
  }else if(c.skin==='titan'){
    rr(cx,4-rec,-6,c.bl+r-8,12,4);cx.fill();cx.stroke();
    rr(cx,c.bl+r-10-rec,-8.5,5,17,2);cx.fill();cx.stroke();
  }else if(c.skin==='longshot'){
    rr(cx,4-rec,-2.5,c.bl+r-6,5,2);cx.fill();cx.stroke();
  }else if(c.skin==='scatter'){
    rr(cx,4-rec,-7,c.bl+r-10,14,4);cx.fill();cx.stroke();
    rr(cx,c.bl+r-12-rec,-9,5,18,2);cx.fill();cx.stroke();
  }else if(c.skin==='ricochet'){
    rr(cx,4-rec,-4,c.bl+r-8,8,3);cx.fill();cx.stroke();
    cx.fillStyle='#7ae0c3';rr(cx,c.bl+r-11-rec,-4,5,8,2);cx.fill();cx.stroke();
  }else if(c.skin==='bombard'){
    cx.fillStyle=c.dark;cx.beginPath();cx.arc(0,0,r*.5,0,Math.PI*2);cx.fill();cx.stroke();
    cx.fillStyle=c.dark;rr(cx,2-rec,-6.5,c.bl+r-6,13,5);cx.fill();cx.stroke();
    cx.fillStyle='#454458';cx.beginPath();cx.arc(c.bl+r-6-rec,0,7,0,Math.PI*2);cx.fill();cx.stroke();
  }else if(c.skin==='blaze'){
    rr(cx,4-rec,-5,c.bl+r-10,10,3);cx.fill();cx.stroke();
    cx.fillStyle='#ffb703';
    cx.beginPath();cx.moveTo(c.bl+r-8-rec,-7);cx.lineTo(c.bl+r-1-rec,0);cx.lineTo(c.bl+r-8-rec,7);cx.closePath();cx.fill();cx.stroke();
  }else{
    rr(cx,4-rec,-4,c.bl+r-8,8,3);cx.fill();cx.stroke();
  }
  if(rec>2.5){
    const mx=c.bl+r-2;
    cx.fillStyle='#ffd166';
    cx.beginPath();
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2,rad=i%2?5:11;cx.lineTo(mx+Math.cos(a)*rad,Math.sin(a)*rad)}
    cx.closePath();cx.fill();
  }
  cx.restore();
  drawPortrait(o.x,o.y,r*.66,c.color,o.teamColor||(o.team!==undefined?TEAMS[o.team].color:null));
  if(fx){
    if(o.shield>0){cx.strokeStyle='rgba(61,126,166,.8)';cx.lineWidth=3.5;
      cx.beginPath();cx.arc(o.x,o.y,r+7+Math.sin(frame*.15)*1.5,0,Math.PI*2);cx.stroke()}
    if(fx.star>0){cx.strokeStyle='hsl('+(frame*9%360)+' 90% 60%)';cx.lineWidth=4;
      cx.beginPath();cx.arc(o.x,o.y,r+5,0,Math.PI*2);cx.stroke()}
    if(fx.frozen>0){cx.fillStyle='rgba(120,190,235,.4)';rr(cx,o.x-r,o.y-r,r*2,r*2,8);cx.fill();
      cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=2;rr(cx,o.x-r,o.y-r,r*2,r*2,8);cx.stroke()}
    if(fx.reverse>0){cx.fillStyle='#ff8c42';cx.font='900 15px system-ui,Arial,sans-serif';
      cx.textAlign='center';cx.textBaseline='middle';cx.fillText('?',o.x+r*.9,o.y-r-8)}
  }
  cx.globalAlpha=1;
}
function drawTank(t){
  if(t.hp<=0)return;
  if(tileAt(t.x,t.y)==='b'&&state==='play')return; // hidden in a bush
  if(t.inv>0&&(t.inv>>2)%2===0)return;
  drawTankBody(t);
}
function drawTeamTag(t){
  const y=t.y-t.cls.radius-22;
  cx.fillStyle=t.teamColor;rr(cx,t.x-17,y-9,34,18,7);cx.fill();
  cx.lineWidth=2.5;cx.strokeStyle=INK;rr(cx,t.x-17,y-9,34,18,7);cx.stroke();
  cx.fillStyle='#fff';cx.font='900 11px system-ui,Arial,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText(t.tag,t.x,y+1);
}
function drawBullets(){
  for(const b of bullets){
    if(b.air){
      const prog=1-(b.life/b.life0),h=Math.sin(prog*Math.PI);
      cx.fillStyle='rgba(34,35,59,.25)';
      cx.beginPath();cx.ellipse(b.x,b.y,6*(1-h*.4),3,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#8a9a2f';cx.strokeStyle=INK;cx.lineWidth=2.5;
      cx.beginPath();cx.arc(b.x,b.y-h*26,b.r*(1+h*.5),0,Math.PI*2);cx.fill();cx.stroke();
      continue;
    }
    const g=GUNS[b.gun];
    if(g.trail&&(b.px||b.py)){
      cx.strokeStyle='rgba(255,255,255,.6)';cx.lineWidth=3;
      cx.beginPath();cx.moveTo(b.px,b.py);cx.lineTo(b.x,b.y);cx.stroke();
    }
    if(b.gun==='flame'){
      const f=b.life/13;
      cx.globalAlpha=.35+f*.5;
      cx.fillStyle=f>.6?'#ffd166':f>.3?'#ff8c42':'#d95d39';
      cx.beginPath();cx.arc(b.x,b.y,b.r+(1-f)*5,0,Math.PI*2);cx.fill();
      cx.globalAlpha=1;continue;
    }
    if(b.phase){
      cx.globalAlpha=.6+.3*Math.sin(frame*.3);
      cx.fillStyle='#cfe3ff';cx.strokeStyle='#8d99ae';cx.lineWidth=2.5;
      cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill();cx.stroke();
      cx.globalAlpha=1;continue;
    }
    cx.fillStyle=b.gun==='shell'?'#f4a259':b.gun==='ricochet'?'#7ae0c3':'#ffd166';
    cx.strokeStyle=INK;cx.lineWidth=2.5;
    cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill();cx.stroke();
  }
}
function drawArenaFrame(){
  cx.drawImage(bg,0,0);
  drawMarks();
  drawDynamicTiles();
  drawCrates();
  drawMovers();
  drawMinesAndPickups();
  for(const p of parts){cx.globalAlpha=Math.min(1,p.life/14);cx.fillStyle=p.color;cx.beginPath();cx.arc(p.x,p.y,p.size,0,Math.PI*2);cx.fill()}
  cx.globalAlpha=1;
  drawBullets();
  tanks.forEach(drawTank);
  drawBushes();
  drawAmbient();
  for(const f of floats){
    cx.globalAlpha=Math.min(1,f.life/20);
    cx.font='900 14px system-ui,Arial,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
    cx.lineWidth=3;cx.strokeStyle=INK;cx.strokeText(f.txt,f.x,f.y);
    cx.fillStyle=f.color;cx.fillText(f.txt,f.x,f.y);
  }
  cx.globalAlpha=1;
}

/* ---------------- HUD ---------------- */
function hudPlate(t,left){
  const w=216,h=62,x=left?14:W-14-w,y=H-h-12;
  cx.save();
  cx.fillStyle='rgba(34,35,59,.25)';rr(cx,x+4,y+5,w,h,12);cx.fill();
  cx.fillStyle=CREAM;rr(cx,x,y,w,h,12);cx.fill();
  cx.lineWidth=3.5;cx.strokeStyle=INK;rr(cx,x,y,w,h,12);cx.stroke();
  drawPortrait(x+31,y+29,18,t.cls.color,t.teamColor);
  cx.fillStyle=t.teamColor;rr(cx,x+17,y+40,28,15,6);cx.fill();
  cx.lineWidth=2;cx.strokeStyle=INK;rr(cx,x+17,y+40,28,15,6);cx.stroke();
  cx.fillStyle='#fff';cx.font='900 10px system-ui,Arial,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText(t.tag,x+31,y+48);
  const bx=x+58,by=y+12,bw=146,bh=16,seg=bw/t.maxHp;
  cx.fillStyle='#d8cbb4';rr(cx,bx,by,bw,bh,6);cx.fill();
  for(let i=0;i<t.hp;i++){cx.fillStyle=t.cls.color;rr(cx,bx+i*seg+1.5,by+1.5,seg-3,bh-3,4);cx.fill()}
  cx.lineWidth=2.5;cx.strokeStyle=INK;rr(cx,bx,by,bw,bh,6);cx.stroke();
  cx.fillStyle=INK;cx.font='800 11px system-ui,Arial,sans-serif';cx.textAlign='left';cx.textBaseline='middle';
  cx.fillText((t.name||t.tag).slice(0,12),bx,y+6);
  const goal=mode==='campaign'?1:WIN_SCORE;
  cx.font='15px system-ui,Arial,sans-serif';cx.textAlign='left';
  let stars='';for(let i=0;i<goal;i++)stars+=i<t.score?'★':'☆';
  cx.fillStyle='#e7a600';cx.fillText(stars,bx,by+33);
  cx.fillStyle=INK;cx.font='800 11px system-ui,Arial,sans-serif';cx.textAlign='right';
  cx.fillText(t.cls.name,bx+bw,by+33);
  // active effect chips above the plate
  let cxr=left?x+8:x+w-8-16,step=left?20:-20,drawn=0;
  const chips=[];
  for(const p of POWERS){
    if(p.id==='heal'||p.id==='freeze'||p.id==='flip')continue;
    if(p.id==='shield'){if(t.shield>0)chips.push(p)}
    else if(p.id==='mine'){if(t.minesToLay>0)chips.push(p)}
    else if(t.fx&&t.fx[p.id]>0)chips.push(p);
  }
  if(t.fx&&t.fx.frozen>0)chips.push(POWERS.find(p=>p.id==='freeze'));
  if(t.fx&&t.fx.reverse>0)chips.push(POWERS.find(p=>p.id==='flip'));
  for(const p of chips){
    const chx=cxr+step*drawn,chy=y-14;drawn++;
    cx.fillStyle=CREAM;cx.beginPath();cx.arc(chx+8,chy,9,0,Math.PI*2);cx.fill();
    cx.lineWidth=2;cx.strokeStyle=p.color;cx.stroke();
    cx.fillStyle=p.color;cx.font='900 10px system-ui,Arial,sans-serif';cx.textAlign='center';
    cx.fillText(p.glyph,chx+8,chy+1);
  }
  cx.restore();
}

/* ================= ONLINE (self-hosted build only) =================
   Host-authoritative: the host simulates and broadcasts snapshots at 20Hz,
   the guest sends its input and renders what it is told. Needs relay-server.js. */
const RKEY='tanksmash_relay_v1';
/* Set this to your own Render service and players never have to type a URL.
   Order of preference: ?relay= in the link > saved value > this default. */
const DEFAULT_RELAY='wss://karhutrades.com/ws';
const NET={
  ws:null,role:null,code:'',status:'IDLE',msg:'',
  relay:'',editing:false,field:0,
  connected:false,peer:false,ready:false,waking:false,wakeTries:0,wakeStart:0,
  theirClass:null,theirName:'OPPONENT',theirColor:'#35a44a',
  lastSent:null,sentAt:0,snapAt:0,lastRecv:0,ping:0,
};
try{
  const q=new URLSearchParams(location.search).get('relay');
  NET.relay=q||localStorage.getItem(RKEY)||'';
  if(q)localStorage.setItem(RKEY,q);
}catch(e){}
if(!NET.relay){
  NET.relay=(location.hostname==='localhost'||location.hostname==='127.0.0.1')
    ?'ws://localhost:8787':DEFAULT_RELAY;
}
const netHost=()=>NET.role==='host';
function netSend(o){
  if(NET.ws&&NET.ws.readyState===1){try{NET.ws.send(JSON.stringify(o))}catch(e){}}
}
function netStatus(s,m){NET.status=s;NET.msg=m||''}
function netDisconnect(){
  if(NET.ws){try{NET.ws.close()}catch(e){}}
  NET.ws=null;NET.connected=false;NET.peer=false;NET.role=null;NET.theirClass=null;
}
function relayHttp(){return NET.relay.replace(/^wss:/,'https:').replace(/^ws:/,'http:')}
/* Free hosts sleep when idle. Poll /health first so a cold start shows as
   "waking" instead of a failed connection, then open the socket. */
async function netWake(){
  NET.waking=true;NET.wakeTries=0;NET.wakeStart=Date.now();
  for(let i=0;i<20;i++){
    NET.wakeTries=i+1;
    const secs=Math.round((Date.now()-NET.wakeStart)/1000);
    netStatus('WAKING','relay starting up · '+secs+'s (free hosts sleep when idle)');
    try{
      const ctl=new AbortController();
      const to=setTimeout(()=>ctl.abort(),5000);
      const r=await fetch(relayHttp()+'/health',{cache:'no-store',signal:ctl.signal});
      clearTimeout(to);
      if(r.ok){NET.waking=false;return true}
    }catch(e){}
    await new Promise(r=>setTimeout(r,2500));
  }
  NET.waking=false;
  return false; // try the socket anyway: /health may be blocked while WS is fine
}
async function netConnect(role,code){
  netDisconnect();
  NET.role=role;NET.code=code;
  await netWake();
  if(NET.role!==role||NET.code!==code)return; // superseded while waking
  netStatus('CONNECTING','opening '+NET.relay);
  let ws;
  try{ws=new WebSocket(NET.relay)}
  catch(e){netStatus('FAILED','cannot open a socket here: '+e.message);return}
  NET.ws=ws;
  setTimeout(()=>{if(NET.ws===ws&&ws.readyState===0){netStatus('FAILED','no answer from '+NET.relay+' · check the URL (wss:// for https pages)')}},12000);
  ws.onopen=()=>{netStatus('WAITING','room '+code+' · waiting for the other player');netSend({t:'join',room:code,role})};
  ws.onerror=()=>netStatus('FAILED','could not reach '+NET.relay);
  ws.onclose=()=>{if(NET.status!=='FAILED')netStatus('CLOSED','connection closed');NET.connected=false;NET.peer=false};
  ws.onmessage=ev=>{
    let m;try{m=JSON.parse(ev.data)}catch(e){return}
    NET.lastRecv=frame;
    if(m.t==='role'){NET.role=m.role;NET.connected=true;netStatus(m.peers>1?'READY':'WAITING',m.peers>1?'opponent connected':'room '+code+' · waiting');NET.peer=m.peers>1;if(NET.peer)netEnterSelect()}
    else if(m.t==='peer'){NET.peer=true;netStatus('READY','opponent connected');sLock();netEnterSelect()}
    else if(m.t==='peerleft'){NET.peer=false;NET.theirClass=null;netStatus('WAITING','opponent left');if(state!=='online'){toast={txt:'OPPONENT LEFT',life:200};goto('online')}}
    else if(m.t==='pick'){NET.theirClass=m.cls;NET.theirName=(m.name||'OPPONENT').slice(0,12);NET.theirColor=m.color||'#35a44a';if(netHost())netTryStart()}
    else if(m.t==='start'&&!netHost())netGuestStart(m);
    else if(m.t==='snap'&&!netHost())netApplySnap(m);
    else if(m.t==='in'&&netHost()){const o=tanks[1];if(o)o.netInput={dx:m.dx,dy:m.dy,fire:!!m.f}}
    else if(m.t==='bye'){NET.peer=false;netStatus('WAITING','opponent left')}
  };
}

  // the guest is tank index 1 on the host, and drives it locally
  tanks=[makeTank(0,m.a,true,null,0,m.ac||'#ef3e4a'),
         makeTank(1,m.b,true,null,0,prof(0).color)];
  tanks[0].name=(m.an||'HOST').slice(0,12);
  tanks[1].name=prof(0).name;tanks[1].netLocal=true;
  tanks.forEach(t=>{t.teamColor=t.profColor||TEAMS[t.team].color});
  mapIndex=m.mapIndex|0;
  startRound();
}
/* ---- snapshots ---- */
function netSnapshot(){
  const dead=[];
  for(const k in crateHp)if(crateHp[k]<=0)dead.push(+k);
  return{t:'snap',f:frame,st:state,tm:timer,mi:mapIndex,
    tk:tanks.map(t=>({x:Math.round(t.x*4)/4,y:Math.round(t.y*4)/4,a:Math.round(t.ang*100)/100,
      hp:t.hp,iv:t.inv,sh:t.shield,rc:Math.round(t.recoil),ds:Math.round(t.dist),sc:t.score,
      fz:t.fx.frozen,rv:t.fx.reverse,st:t.fx.star,gh:t.fx.ghost})),
    bl:bullets.map(b=>({x:Math.round(b.x),y:Math.round(b.y),r:b.r,g:b.gun,
      ai:b.air?1:0,li:b.life,l0:b.life0,ph:b.phase?1:0,px:Math.round(b.px),py:Math.round(b.py)})),
    pu:pickups.map(p=>({x:p.x,y:p.y,i:POWERS.indexOf(p.def)})),
    mn:mines.map(m=>({x:Math.round(m.x),y:Math.round(m.y),a:m.arm})),
    cr:dead,rw:roundWinner?roundWinner.team:-1};
}
function netApplySnap(m){
  if(m.mi!==mapIndex&&MAPS[m.mi]){mapIndex=m.mi;startRound()}
  frame=m.f;state=m.st;timer=m.tm;
  m.tk.forEach((s,i)=>{
    const t=tanks[i];if(!t)return;
    t.x=s.x;t.y=s.y;t.ang=s.a;t.hp=s.hp;t.inv=s.iv;t.shield=s.sh;
    t.recoil=s.rc;t.dist=s.ds;t.score=s.sc;
    t.fx.frozen=s.fz;t.fx.reverse=s.rv;t.fx.star=s.st;t.fx.ghost=s.gh;
  });
  bullets=m.bl.map(b=>({x:b.x,y:b.y,px:b.px,py:b.py,r:b.r,gun:b.g,air:!!b.ai,
    life:b.li,life0:b.l0,phase:!!b.ph,vx:0,vy:0,dmg:1,bounces:0}));
  pickups=m.pu.map(p=>({x:p.x,y:p.y,def:POWERS[p.i]||POWERS[0],age:0}));
  mines=m.mn.map(x=>({x:x.x,y:x.y,arm:x.a,life:900,owner:tanks[0]}));
  for(const k of m.cr){if(crateHp[k]>0){crateHp[k]=0;const gx=k%COLS,gy=(k/COLS)|0;cells[gy][gx]='.'}}
  roundWinner=m.rw>=0?tanks[m.rw]:roundWinner;
}
/* ---- drive the loop ---- */
const _step=step;
step=function(){
  if(mode!=='online'||!NET.connected||state==='online'||state==='mode'||state==='title'||state==='profiles'||state==='name'){
    _step();return;
  }
  if(netHost()){
    _step();
    if(frame%3===0)netSend(netSnapshot());
  }else{
    // guest: cosmetics locally, everything else comes from the host
    frame++;
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.92;p.vy*=.92;if(--p.life<=0)parts.splice(i,1)}
    for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y-=.7;if(--f.life<=0)floats.splice(i,1)}
    for(let i=marks.length-1;i>=0;i--){if(--marks[i].life<=0)marks.splice(i,1)}
    if(shake>0)shake*=.86;
    stepAmbient();
    if(state==='select'){stepSelect();pressQ.clear();return}
    const t=tanks[1];
    if(t){
      const inp=humanInput(t);
      const sig=inp.dx+','+inp.dy+','+inp.fire;
      if(sig!==NET.lastSent||frame-NET.sentAt>10){
        NET.lastSent=sig;NET.sentAt=frame;
        netSend({t:'in',dx:inp.dx,dy:inp.dy,f:inp.fire});
      }
      if(inp.dx||inp.dy)t.ang=lerpAngle(t.ang,Math.atan2(inp.dy,inp.dx),.3);
    }
    if(state==='game'&&navOk()){netSend({t:'again'});}
    pressQ.clear();
  }
};
/* connection loss during a match drops you back to the lobby */
const _draw=draw;
draw=function(){
  _draw();
  if(mode==='online'&&NET.connected&&state!=='online'){
    const bad=!NET.peer;
    panel(W-190,H-30,176,22,null,8);
    label(bad?'OPPONENT LOST':(netHost()?'ONLINE · HOST':'ONLINE · GUEST'),W-102,H-19,11,bad?'#ef3e4a':'#8a8672');
  }
};
</script>
