/* ---------------- tank drawing ---------------- */
function drawDeco(c,hw,hh,r){
  const d=c.deco||'none';
  cx.lineWidth=2;
  if(d==='stripe'){
    cx.fillStyle='rgba(255,255,255,.7)';
    cx.fillRect(-hw,-5.5,hw*2,3.6);cx.fillRect(-hw,2.4,hw*2,3.6);
  }else if(d==='checker'){
    for(let i=0;i<6;i++){cx.fillStyle=i%2?'rgba(255,255,255,.8)':'rgba(20,22,40,.55)';
      cx.fillRect(-hw+ i*(hw*2/6),-4.5,hw*2/6,9)}
  }else if(d==='star'){
    cx.fillStyle='rgba(255,255,255,.75)';
    cx.save();cx.translate(-hw*.45,0);cx.beginPath();
    for(let i=0;i<10;i++){const rr2=i%2?2.4:5.5,a=i/10*Math.PI*2-Math.PI/2;cx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}
    cx.closePath();cx.fill();cx.restore();
  }else if(d==='flame'){
    cx.fillStyle='rgba(255,210,63,.8)';
    for(const sy of [-hh*.55,hh*.55]){
      cx.beginPath();cx.moveTo(-hw*.7,sy);cx.quadraticCurveTo(-hw*.2,sy-3,hw*.1,sy);
      cx.quadraticCurveTo(-hw*.2,sy+3,-hw*.7,sy);cx.fill();
    }
  }else if(d==='bolt'){
    cx.fillStyle='rgba(255,255,255,.85)';
    cx.beginPath();cx.moveTo(3,-hh*.7);cx.lineTo(-4,-1);cx.lineTo(0,-1);
    cx.lineTo(-3,hh*.7);cx.lineTo(4,1);cx.lineTo(0,1);cx.closePath();cx.fill();
  }else if(d==='camo'){
    cx.fillStyle='rgba(20,22,40,.25)';
    for(const [bx,by,br2] of [[-hw*.5,-hh*.3,4.5],[hw*.2,hh*.35,5],[hw*.55,-hh*.4,3.5],[-hw*.1,0,4]]){
      cx.beginPath();cx.ellipse(bx,by,br2*1.5,br2,.5,0,Math.PI*2);cx.fill();
    }
  }else if(d==='sand'){
    cx.fillStyle='#d9c58f';cx.strokeStyle='rgba(20,22,40,.5)';
    for(let i=-2;i<=2;i++){cx.beginPath();cx.ellipse(hw*.72,i*4.4,3,2,0,0,Math.PI*2);cx.fill();cx.stroke()}
  }else if(d==='drums'){
    for(const sy of [-4.5,4.5]){
      cx.fillStyle='#8f5f2c';cx.beginPath();cx.arc(-hw*.68,sy,3.8,0,Math.PI*2);cx.fill();
      cx.strokeStyle=INK;cx.stroke();
    }
  }else if(d==='rack'){
    cx.fillStyle='rgba(20,22,40,.55)';
    for(let i=-1;i<=1;i++){rr(cx,-hw*.8,i*5.4-2,5,4,1.5);cx.fill()}
  }else if(d==='fin'){
    cx.fillStyle=c.dark;cx.strokeStyle=INK;
    cx.beginPath();cx.moveTo(-hw*.95,-hh*.5);cx.lineTo(-hw*.45,0);cx.lineTo(-hw*.95,hh*.5);cx.closePath();
    cx.fill();cx.stroke();
  }else if(d==='spikes'){
    cx.fillStyle='#e8e3d0';cx.strokeStyle=INK;
    for(let i=-1;i<=1;i++){
      cx.beginPath();cx.moveTo(hw*.85,i*6-2.5);cx.lineTo(hw*1.25,i*6);cx.lineTo(hw*.85,i*6+2.5);cx.closePath();
      cx.fill();cx.stroke();
    }
  }else if(d==='coil'){
    cx.strokeStyle='rgba(255,255,255,.8)';cx.lineWidth=1.8;
    for(let i=0;i<3;i++){cx.beginPath();cx.arc(-hw*.45,0,3+i*2.6,-.9,.9);cx.stroke()}
  }else if(d==='plate'){
    cx.strokeStyle='rgba(20,22,40,.45)';cx.lineWidth=2.4;
    rr(cx,-hw*.55,-hh*.5,hw*1.1,hh,4);cx.stroke();
    cx.fillStyle='rgba(20,22,40,.5)';
    for(const [px,py] of [[-hw*.55,-hh*.5],[hw*.55,-hh*.5],[-hw*.55,hh*.5],[hw*.55,hh*.5]]){
      cx.beginPath();cx.arc(px,py,1.6,0,Math.PI*2);cx.fill();
    }
  }
}
function drawTankBody(o){
  const c=o.cls,r=c.radius*1.2,rec=Math.max(0,o.recoil||0),fx=o.fx;
  const ta=(o.tang==null?o.ang:o.tang),sq=o.squash||0;
  const ghost=fx&&fx.ghost>0;
  if(ghost)cx.globalAlpha=.45;
  const hover=c.chassis==='hover'||c.chassis==='phantom';
  const bob=hover?Math.sin(frame*.1+(o.team||0)*2)*2:0;
  const lift=BODY_H+(hover?5:0)-bob;
  // cast shadow, offset along the world light direction
  cx.fillStyle='rgba(10,12,24,.28)';
  cx.beginPath();cx.ellipse(o.x+lift*.7,o.y+lift*.9,r*1.1,r*.88,0,0,Math.PI*2);cx.fill();
  // team light pool
  const ring=o.teamColor||(o.team!==undefined?TEAMS[o.team].color:null);
  if(ring){
    cx.save();cx.globalCompositeOperation='lighter';cx.globalAlpha=.13;
    cx.fillStyle=ring;cx.beginPath();cx.ellipse(o.x,o.y+4,r*1.7,r*1.3,0,0,Math.PI*2);cx.fill();
    cx.restore();
  }
  const roll=((o.dist||0)*.9)%1000;
  // hull
  cx.save();cx.translate(o.x,o.y-bob);
  cx.scale(1+sq*.2,1-sq*.2);cx.rotate(o.ang);
  drawChassis(o,c,r,roll);
  cx.restore();
  // barrel rides the turret angle
  cx.save();cx.translate(o.x,o.y-bob-1);
  cx.scale(1+sq*.2,1-sq*.2);cx.rotate(ta);
  drawBarrel(o,c,r,rec);
  if(rec>2.5){
    const mx=c.bl+r-4,k=rec/8;
    cx.fillStyle='#fff6c2';cx.beginPath();
    for(let i=0;i<10;i++){const a=i/10*Math.PI*2,rad=(i%2?5:13)*(.6+k);
      cx.lineTo(mx+Math.cos(a)*rad,Math.sin(a)*rad)}
    cx.closePath();cx.fill();
    cx.save();cx.globalCompositeOperation='lighter';cx.globalAlpha=.6;
    cx.fillStyle='#ffb703';cx.beginPath();cx.arc(mx,0,9*(.5+k),0,Math.PI*2);cx.fill();cx.restore();
  }
  cx.restore();
  // turret dome with the pilot, sitting proud of the hull
  const tr=r*.44;
  cx.save();cx.translate(o.x,o.y-bob-2);cx.scale(1+sq*.16,1-sq*.16);
  cx.fillStyle='rgba(10,12,24,.3)';
  cx.beginPath();cx.ellipse(2.5,3,tr*1.15,tr*1.05,0,0,Math.PI*2);cx.fill();
  cx.fillStyle=shade(c.dark,-.12);cx.beginPath();cx.arc(0,0,tr+3.5,0,Math.PI*2);cx.fill();
  cx.lineWidth=3.2;cx.strokeStyle=INK;cx.stroke();
  cx.save();cx.beginPath();cx.arc(0,0,tr,0,Math.PI*2);cx.clip();
  const cg=cx.createLinearGradient(0,-tr,0,tr);
  cg.addColorStop(0,'#e8f4ff');cg.addColorStop(1,'#7ea6c8');
  cx.fillStyle=cg;cx.fillRect(-tr,-tr,tr*2,tr*2);
  cx.translate(0,tr*.16);
  drawFace(PILOTS[c.pilot]||PILOTS.bulwark,tr*.92,(o.inv>0?'hurt':o.mood||''),
    Math.cos(ta),Math.sin(ta),(frame+(o.team||0)*77)%210<7);
  cx.restore();
  cx.beginPath();cx.arc(0,0,tr,0,Math.PI*2);cx.lineWidth=3.2;cx.strokeStyle=INK;cx.stroke();
  if(ring){cx.lineWidth=2.2;cx.strokeStyle=ring;cx.beginPath();cx.arc(0,0,tr+4.5,0,Math.PI*2);cx.stroke()}
  cx.fillStyle='rgba(255,255,255,.45)';
  cx.beginPath();cx.ellipse(-tr*.38,-tr*.5,tr*.36,tr*.2,-.5,0,Math.PI*2);cx.fill();
  if(ring){
    const ax=tr*.9,ay=-tr*.9,wob=Math.sin(frame*.16+(o.team||0)*3)*2.5;
    cx.strokeStyle=INK;cx.lineWidth=2;
    cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(ax+4,ay-14);cx.stroke();
    cx.fillStyle=ring;cx.lineWidth=1.8;
    cx.beginPath();cx.moveTo(ax+4,ay-14);cx.lineTo(ax+16+wob,ay-11);cx.lineTo(ax+4,ay-7);cx.closePath();
    cx.fill();cx.stroke();
  }
  cx.restore();
  if(fx){
    if(o.shield>0){
      cx.save();cx.globalCompositeOperation='lighter';cx.globalAlpha=.3;
      cx.fillStyle='#5aa9e6';cx.beginPath();cx.arc(o.x,o.y,r+10,0,Math.PI*2);cx.fill();cx.restore();
      cx.strokeStyle='rgba(120,200,255,.9)';cx.lineWidth=3;
      cx.beginPath();cx.arc(o.x,o.y,r+9+Math.sin(frame*.15)*1.5,0,Math.PI*2);cx.stroke();
    }
    if(fx.star>0){cx.strokeStyle='hsl('+(frame*9%360)+' 92% 62%)';cx.lineWidth=4.5;
      cx.beginPath();cx.arc(o.x,o.y,r+7,0,Math.PI*2);cx.stroke()}
    if(fx.frozen>0){
      cx.fillStyle='rgba(150,210,245,.5)';rr(cx,o.x-r,o.y-r,r*2,r*2,9);cx.fill();
      cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=2.5;rr(cx,o.x-r,o.y-r,r*2,r*2,9);cx.stroke();
    }
    if(fx.reverse>0){
      cx.fillStyle='#ff8c42';cx.font='900 16px system-ui,Arial,sans-serif';
      cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=3;cx.strokeStyle=INK;
      cx.strokeText('?',o.x+r*.9,o.y-r-10);cx.fillText('?',o.x+r*.9,o.y-r-10);
    }
  }
  cx.globalAlpha=1;
}
function drawTank(t){
  if(t.dead||t.hp<=0){
    if(t.dead&&t.side===0){
      const a=1-t.respawn/RESPAWN;
      cx.save();cx.globalAlpha=.7;
      cx.strokeStyle=t.teamColor;cx.lineWidth=4;
      cx.beginPath();cx.arc(t.x,t.y,20,-Math.PI/2,-Math.PI/2+Math.PI*2*a);cx.stroke();
      cx.fillStyle=t.teamColor;cx.font='900 12px system-ui,Arial,sans-serif';
      cx.textAlign='center';cx.textBaseline='middle';
      cx.fillText(Math.ceil(t.respawn/60)+'s',t.x,t.y+1);
      cx.restore();
    }
    return;
  }
  if(tileAt(t.x,t.y)==='b'&&state==='play')return; // hidden in a bush
  if(t.inv>0&&(t.inv>>2)%2===0)return;
  drawTankBody(t);
}
function drawTeamTag(t){
  const y=t.y-t.cls.radius-22;
  cx.fillStyle=t.teamColor;rr(cx,t.x-17,y-9,34,18,7);cx.fill();
  cx.lineWidth=2.5;cx.strokeStyle=INK;rr(cx,t.x-17,y-9,34,18,7);cx.stroke();
  cx.fillStyle='#fff';cx.font='900 11px system-ui,Arial,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText(t.tag,t.x,y+1);
}
function drawBullets(){
  for(const b of bullets){
    if(b.air){
      const prog=1-(b.life/b.life0),h=Math.sin(prog*Math.PI);
      cx.fillStyle='rgba(34,35,59,.25)';
      cx.beginPath();cx.ellipse(b.x,b.y,6*(1-h*.4),3,0,0,Math.PI*2);cx.fill();
      cx.fillStyle='#8a9a2f';cx.strokeStyle=INK;cx.lineWidth=2.5;
      cx.beginPath();cx.arc(b.x,b.y-h*26,b.r*(1+h*.5),0,Math.PI*2);cx.fill();cx.stroke();
      continue;
    }
    const g=GUNS[b.gun];
    if(g.trail&&(b.px||b.py)){
      cx.strokeStyle='rgba(255,255,255,.6)';cx.lineWidth=3;
      cx.beginPath();cx.moveTo(b.px,b.py);cx.lineTo(b.x,b.y);cx.stroke();
    }
    if(b.gun==='flame'){
      const f=b.life/13;
      cx.globalAlpha=.35+f*.5;
      cx.fillStyle=f>.6?'#ffd166':f>.3?'#ff8c42':'#d95d39';
      cx.beginPath();cx.arc(b.x,b.y,b.r+(1-f)*5,0,Math.PI*2);cx.fill();
      cx.globalAlpha=1;continue;
    }
    if(b.phase){
      cx.globalAlpha=.6+.3*Math.sin(frame*.3);
      cx.fillStyle='#cfe3ff';cx.strokeStyle='#8d99ae';cx.lineWidth=2.5;
      cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill();cx.stroke();
      cx.globalAlpha=1;continue;
    }
    const col=b.gun==='shell'?'#f4a259':b.gun==='ricochet'?(b.hot?'#ffffff':'#7ae0c3'):b.heavy?'#ff8c42':'#ffd166';
    cx.save();cx.globalCompositeOperation='lighter';cx.globalAlpha=.4;
    cx.fillStyle=col;cx.beginPath();cx.arc(b.x,b.y,b.r+5,0,Math.PI*2);cx.fill();
    cx.restore();
    if(b.px||b.py){cx.strokeStyle=col;cx.globalAlpha=.35;cx.lineWidth=b.r;cx.lineCap='round';
      cx.beginPath();cx.moveTo(b.px,b.py);cx.lineTo(b.x,b.y);cx.stroke();cx.globalAlpha=1}
    cx.fillStyle=col;cx.strokeStyle=INK;cx.lineWidth=2.5;
    cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill();cx.stroke();
  }
}
function drawGoals(){
  const gh=GOAL_H,gy=H/2-gh/2,w=GOAL_D-T;
  for(const [side,col] of [[0,teamColor(0)],[1,teamColor(1)]]){
    const x=side===0?T:W-GOAL_D;
    cx.save();
    cx.globalAlpha=.25;cx.fillStyle=col;cx.fillRect(x,gy,w,gh);
    cx.globalAlpha=1;cx.strokeStyle=col;cx.lineWidth=5;
    cx.beginPath();cx.moveTo(side===0?x+w:x,gy);cx.lineTo(side===0?x+w:x,gy+gh);cx.stroke();
    cx.globalAlpha=.4;cx.lineWidth=1.5;cx.strokeStyle='#fff';
    for(let i=0;i<=6;i++){cx.beginPath();cx.moveTo(x,gy+i*gh/6);cx.lineTo(x+w,gy+i*gh/6);cx.stroke()}
    for(let i=0;i<=5;i++){cx.beginPath();cx.moveTo(x+i*w/5,gy);cx.lineTo(x+i*w/5,gy+gh);cx.stroke()}
    cx.globalAlpha=.85;cx.fillStyle=col;cx.font='900 11px system-ui,Arial,sans-serif';
    cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText('GOAL',x+w/2,gy-12);
    cx.restore();
  }
  // centre circle
  cx.save();cx.globalAlpha=.18;cx.strokeStyle='#fff';cx.lineWidth=4;
  cx.beginPath();cx.arc(W/2,H/2,70,0,Math.PI*2);cx.stroke();
  cx.beginPath();cx.moveTo(W/2,30);cx.lineTo(W/2,H-30);cx.stroke();
  cx.restore();
}
function drawZone(){
  if(!zone)return;
  const col=zone.owner===0?teamColor(0):zone.owner===1?teamColor(1):'#ffd166';
  const pulse=1+Math.sin(frame*.09)*.04;
  cx.save();
  cx.globalAlpha=.16;cx.fillStyle=col;
  cx.beginPath();cx.arc(zone.x,zone.y,zone.r*pulse,0,Math.PI*2);cx.fill();
  cx.globalAlpha=.9;cx.strokeStyle=col;cx.lineWidth=5;cx.setLineDash([13,9]);
  cx.lineDashOffset=-frame*.7;
  cx.beginPath();cx.arc(zone.x,zone.y,zone.r*pulse,0,Math.PI*2);cx.stroke();
  cx.setLineDash([]);
  cx.globalAlpha=.5;cx.lineWidth=2.5;
  cx.beginPath();cx.arc(zone.x,zone.y,zone.r*pulse*.55,0,Math.PI*2);cx.stroke();
  // countdown wedge for the next move
  cx.globalAlpha=.8;cx.strokeStyle='#fff';cx.lineWidth=4;
  cx.beginPath();cx.arc(zone.x,zone.y,zone.r*pulse+9,-Math.PI/2,-Math.PI/2+Math.PI*2*(zone.life/(60*22)));cx.stroke();
  cx.restore();
}
function drawBall(){
  if(!ball)return;
  cx.fillStyle='rgba(12,14,26,.3)';
  cx.beginPath();cx.ellipse(ball.x,ball.y+ball.r*.8,ball.r*.9,ball.r*.4,0,0,Math.PI*2);cx.fill();
  cx.save();cx.translate(ball.x,ball.y);cx.rotate(ball.spin);
  const g=cx.createRadialGradient(-5,-6,3,0,0,ball.r);
  g.addColorStop(0,'#ffffff');g.addColorStop(1,'#cfd6e6');
  cx.fillStyle=g;cx.beginPath();cx.arc(0,0,ball.r,0,Math.PI*2);cx.fill();
  cx.fillStyle=INK;
  cx.beginPath();
  for(let i=0;i<5;i++){const a=i/5*Math.PI*2;cx.moveTo(Math.cos(a)*7,Math.sin(a)*7);
    cx.arc(Math.cos(a)*8.5,Math.sin(a)*8.5,3.4,0,Math.PI*2)}
  cx.fill();
  cx.beginPath();cx.arc(0,0,4.2,0,Math.PI*2);cx.fill();
  cx.lineWidth=3;cx.strokeStyle=INK;cx.beginPath();cx.arc(0,0,ball.r,0,Math.PI*2);cx.stroke();
  cx.restore();
}
function drawArenaFrame(){
  cx.drawImage(bg,0,0);
  if(kindOf()==='ball')drawGoals();
  if(kindOf()==='zone')drawZone();
  drawMarks();
  drawDynamicTiles();
  drawCrates();
  drawMovers();
  drawMinesAndPickups();
  for(const bn of burns){
    const f=bn.life/90;
    cx.save();cx.globalCompositeOperation='lighter';
    cx.globalAlpha=.35*f+.1*Math.sin(frame*.4+bn.x);
    cx.fillStyle='#ff8c42';cx.beginPath();cx.arc(bn.x,bn.y,11+Math.sin(frame*.3+bn.y)*2,0,Math.PI*2);cx.fill();
    cx.globalAlpha=.5*f;cx.fillStyle='#ffd166';
    cx.beginPath();cx.arc(bn.x,bn.y-2,6+Math.sin(frame*.5+bn.x)*1.5,0,Math.PI*2);cx.fill();
    cx.restore();
  }
  for(const p of parts){
    if(p.color==='smoke'){
      cx.globalAlpha=Math.min(1,p.life/34)*.3;cx.fillStyle='#6b6f7d';
      cx.beginPath();cx.arc(p.x,p.y,p.size+(34-p.life)*.18,0,Math.PI*2);cx.fill();
    }else{
      cx.globalAlpha=Math.min(1,p.life/14);cx.fillStyle=p.color;
      cx.beginPath();cx.arc(p.x,p.y,p.size,0,Math.PI*2);cx.fill();
    }
  }
  cx.globalAlpha=1;
  cx.save();cx.globalCompositeOperation='lighter';
  for(const rg of rings){
    cx.globalAlpha=rg.life/22*.7;cx.strokeStyle=rg.color;cx.lineWidth=rg.w*(rg.life/22)+1;
    cx.beginPath();cx.arc(rg.x,rg.y,rg.r,0,Math.PI*2);cx.stroke();
  }
  cx.restore();cx.globalAlpha=1;
  drawBall();
  drawBullets();
  for(const t of tanks){
    if(!(t.charge>0)||t.hp<=0)continue;
    const ta=(t.tang==null?t.ang:t.tang),g=GUNS[t.cls.gun];
    const lx=t.x+Math.cos(ta)*t.charge,ly=t.y+Math.sin(ta)*t.charge;
    cx.save();
    // dotted flight path that arcs like the shell will
    cx.setLineDash([4,9]);cx.lineDashOffset=-frame*.9;
    cx.strokeStyle=t.teamColor;cx.lineWidth=3.5;cx.globalAlpha=.9;
    cx.beginPath();
    const steps=14;
    for(let k=0;k<=steps;k++){
      const f=k/steps;
      const px=t.x+Math.cos(ta)*t.charge*f,py=t.y+Math.sin(ta)*t.charge*f-Math.sin(f*Math.PI)*34;
      k?cx.lineTo(px,py):cx.moveTo(px,py);
    }
    cx.stroke();cx.setLineDash([]);
    // landing zone: pulsing blast ring + crosshair
    const pulse=1+Math.sin(frame*.25)*.08;
    cx.globalAlpha=.22;cx.fillStyle=t.teamColor;
    cx.beginPath();cx.arc(lx,ly,g.aoe*pulse,0,Math.PI*2);cx.fill();
    cx.globalAlpha=.95;cx.lineWidth=3;cx.strokeStyle=t.teamColor;
    cx.beginPath();cx.arc(lx,ly,g.aoe*pulse,0,Math.PI*2);cx.stroke();
    cx.lineWidth=2.5;
    cx.beginPath();cx.moveTo(lx-9,ly);cx.lineTo(lx+9,ly);cx.moveTo(lx,ly-9);cx.lineTo(lx,ly+9);cx.stroke();
    cx.strokeStyle=INK;cx.globalAlpha=.5;cx.lineWidth=1.5;
    cx.beginPath();cx.arc(lx,ly,g.aoe*pulse+2,0,Math.PI*2);cx.stroke();
    cx.restore();
  }
  tanks.forEach(drawTank);
  for(const t of tanks){
    if(!(t.lock>14)||t.ai)continue;
    const e=tanks[1-t.team];
    if(!e||e.hp<=0)continue;
    const rr2=e.cls.radius+13,a0=frame*.06;
    cx.save();cx.globalAlpha=.5;cx.strokeStyle=t.teamColor;cx.lineWidth=3;cx.lineCap='round';
    for(let k=0;k<4;k++){cx.beginPath();cx.arc(e.x,e.y,rr2,a0+k*Math.PI/2,a0+k*Math.PI/2+.5);cx.stroke()}
    cx.restore();
  }
  drawBushes();
  drawAmbient();
  for(const f of floats){
    cx.globalAlpha=Math.min(1,f.life/20);
    cx.font='900 14px system-ui,Arial,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
    cx.lineWidth=3;cx.strokeStyle=INK;cx.strokeText(f.txt,f.x,f.y);
    cx.fillStyle=f.color;cx.fillText(f.txt,f.x,f.y);
  }
  cx.globalAlpha=1;
}

/* ---------------- HUD ---------------- */
function hudPlate(t,left){
  const w=216,h=62,x=left?14:W-14-w,y=H-h-12;
  let near=false;
  for(const k of tanks){
    if(k.hp<=0)continue;
    if(k.x>x-70&&k.x<x+w+70&&k.y>y-60)near=true;
  }
  t.plateA=t.plateA==null?1:t.plateA+((near?.22:1)-t.plateA)*.15;
  cx.save();
  cx.globalAlpha=t.plateA;
  cx.fillStyle='rgba(34,35,59,.25)';rr(cx,x+4,y+5,w,h,12);cx.fill();
  cx.fillStyle=CREAM;rr(cx,x,y,w,h,12);cx.fill();
  cx.lineWidth=3.5;cx.strokeStyle=INK;rr(cx,x,y,w,h,12);cx.stroke();
  drawBadge(x+31,y+29,18,t.cls,t.teamColor,t.hp<=1?'hurt':'',0,0);
  cx.fillStyle=t.teamColor;rr(cx,x+17,y+40,28,15,6);cx.fill();
  cx.lineWidth=2;cx.strokeStyle=INK;rr(cx,x+17,y+40,28,15,6);cx.stroke();
  cx.fillStyle='#fff';cx.font='900 10px system-ui,Arial,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText(t.tag,x+31,y+48);
  const bx=x+58,by=y+12,bw=146,bh=16,seg=bw/t.maxHp;
  cx.fillStyle='#d8cbb4';rr(cx,bx,by,bw,bh,6);cx.fill();
  for(let i=0;i<t.hp;i++){cx.fillStyle=t.cls.color;rr(cx,bx+i*seg+1.5,by+1.5,seg-3,bh-3,4);cx.fill()}
  cx.lineWidth=2.5;cx.strokeStyle=INK;rr(cx,bx,by,bw,bh,6);cx.stroke();
  cx.fillStyle=INK;cx.font='800 11px system-ui,Arial,sans-serif';cx.textAlign='left';cx.textBaseline='middle';
  cx.fillText((t.name||t.tag).slice(0,12),bx,y+6);
  const goal=mode==='campaign'?1:WIN_SCORE;
  cx.font='15px system-ui,Arial,sans-serif';cx.textAlign='left';
  let stars='';for(let i=0;i<goal;i++)stars+=i<t.score?'★':'☆';
  cx.fillStyle='#e7a600';cx.fillText(stars,bx,by+33);
  cx.fillStyle=INK;cx.font='800 11px system-ui,Arial,sans-serif';cx.textAlign='right';
  cx.fillText(t.cls.name,bx+bw,by+33);
  // active effect chips above the plate
  let cxr=left?x+8:x+w-8-16,step=left?20:-20,drawn=0;
  const chips=[];
  for(const p of POWERS){
    if(p.id==='heal'||p.id==='freeze'||p.id==='flip')continue;
    if(p.id==='shield'){if(t.shield>0)chips.push(p)}
    else if(p.id==='mine'){if(t.minesToLay>0)chips.push(p)}
    else if(t.fx&&t.fx[p.id]>0)chips.push(p);
  }
  if(t.fx&&t.fx.frozen>0)chips.push(POWERS.find(p=>p.id==='freeze'));
  if(t.fx&&t.fx.reverse>0)chips.push(POWERS.find(p=>p.id==='flip'));
  for(const p of chips){
    const chx=cxr+step*drawn,chy=y-14;drawn++;
    cx.fillStyle=CREAM;cx.beginPath();cx.arc(chx+8,chy,10,0,Math.PI*2);cx.fill();
    cx.lineWidth=2;cx.strokeStyle=p.color;cx.stroke();
    drawPowerIcon(p.id,chx+8,chy,14);
  }
  // the item slot sits beside the plate and spins like a kart item box
  cx.globalAlpha=1;
  const spin=t.roul,landed=t.lastRoll&&t.lastRoll.ttl>0;
  if(spin||landed){
    const sw=54,sx=left?x+w+10:x-10-sw,sy=y+h-sw;
    const pop=landed?1+Math.max(0,(t.lastRoll.ttl-92)/18)*.35:1;
    cx.save();cx.translate(sx+sw/2,sy+sw/2);cx.scale(pop,pop);
    cx.fillStyle='rgba(12,14,26,.4)';rr(cx,-sw/2+4,-sw/2+5,sw,sw,12);cx.fill();
    const gg=cx.createLinearGradient(0,-sw/2,0,sw/2);
    gg.addColorStop(0,'#fffaf0');gg.addColorStop(1,'#efe2c8');
    cx.fillStyle=gg;rr(cx,-sw/2,-sw/2,sw,sw,12);cx.fill();
    cx.strokeStyle=INK;cx.lineWidth=3.5;rr(cx,-sw/2,-sw/2,sw,sw,12);cx.stroke();
    cx.save();cx.beginPath();rr(cx,-sw/2+5,-sw/2+5,sw-10,sw-10,8);cx.clip();
    if(spin){
      const ph=(spin.n%6)/6;
      for(let k=-1;k<=1;k++){
        const p=POWERS[(spin.idx+k+POWERS.length)%POWERS.length];
        drawPowerIcon(p.id,0,(k+ph)*30,30);
      }
    }else{
      const p=t.lastRoll.def;
      drawPowerIcon(p.id,0,0,39.0);
    }
    cx.restore();
    if(landed){
      cx.lineWidth=3;cx.strokeStyle=t.lastRoll.def.color;
      rr(cx,-sw/2+3,-sw/2+3,sw-6,sw-6,10);cx.stroke();
      cx.fillStyle=INK;cx.font='800 9px system-ui,Arial,sans-serif';cx.textAlign='center';
      cx.fillText(t.lastRoll.def.label,0,sw/2+10);
    }
    cx.restore();
  }
  cx.restore();
}

/* ================= TANK ART =================
   Every class has its own chassis routine. They share only the lighting model:
   a shadow cast down-right, a body lit from the top-left, a gloss band, and a
   raised turret that sits above the hull with its own contact shadow. */
const BODY_H=7;                 // how far the hull sits "above" the ground

function lit(c,x0,y0,x1,y1,col){
  const g=c.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,shade(col,.42));g.addColorStop(.45,col);g.addColorStop(1,shade(col,-.20));
  return g;
}
function tread(c,x,y,w,h,dark,roll){
  c.fillStyle=shade(dark,-.35);rr(c,x,y,w,h,h*.42);c.fill();
  c.strokeStyle=INK;c.lineWidth=3;rr(c,x,y,w,h,h*.42);c.stroke();
  c.save();c.beginPath();rr(c,x,y,w,h,h*.42);c.clip();
  c.strokeStyle='rgba(255,255,255,.20)';c.lineWidth=2.4;
  for(let n=-w;n<w*2;n+=7){c.beginPath();c.moveTo(x+((n+roll)%(w+7)),y);c.lineTo(x+((n+roll)%(w+7)),y+h);c.stroke()}
  c.restore();
}
function wheel(c,x,y,r,dark,roll){
  c.fillStyle=shade(dark,-.4);c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
  c.lineWidth=2.6;c.strokeStyle=INK;c.stroke();
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;
  c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(roll)*r*.7,y+Math.sin(roll)*r*.7);c.stroke();
}
function plate(c,pts,col,strokeW){
  c.beginPath();
  pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
  c.closePath();c.fillStyle=col;c.fill();
  c.lineWidth=strokeW||3.2;c.strokeStyle=INK;c.stroke();
}
/* ---- the twelve chassis ---- */
function drawChassis(o,c,r,roll){
  const kind=c.chassis,col=c.color,dk=c.dark;
  const body=lit(cx,-r,-r,r,r,col);
  if(kind==='wedge'){                       // RAZOR: arrowhead speedster
    tread(cx,-r*.95,-r*1.2,r*1.9,r*.5,dk,roll);
    tread(cx,-r*.95, r*.7, r*1.9,r*.5,dk,roll);
    plate(cx,[[r*1.4,0],[r*.2,-r*.85],[-r*.95,-r*.7],[-r*.95,r*.7],[r*.2,r*.85]],body);
    plate(cx,[[r*.9,0],[r*.15,-r*.42],[-r*.5,-r*.34],[-r*.5,r*.34],[r*.15,r*.42]],'rgba(255,255,255,.25)',0);
  }else if(kind==='hover'){                 // HORNET: no tracks, thruster skirt
    cx.save();cx.globalCompositeOperation='lighter';cx.globalAlpha=.35+.15*Math.sin(frame*.25);
    cx.fillStyle=c.light;cx.beginPath();cx.ellipse(0,0,r*1.5,r*1.15,0,0,Math.PI*2);cx.fill();cx.restore();
    cx.fillStyle=shade(dk,-.2);cx.beginPath();cx.ellipse(0,0,r*1.18,r*.95,0,0,Math.PI*2);cx.fill();
    cx.lineWidth=3.2;cx.strokeStyle=INK;cx.stroke();
    cx.fillStyle=body;cx.beginPath();cx.ellipse(0,-2,r*.95,r*.72,0,0,Math.PI*2);cx.fill();cx.stroke();
    cx.fillStyle='rgba(255,255,255,.3)';cx.beginPath();cx.ellipse(-r*.2,-r*.35,r*.5,r*.22,-.3,0,Math.PI*2);cx.fill();
  }else if(kind==='sixwheel'){              // VIPER: six fat wheels
    for(const sx of [-r*.72,0,r*.72])for(const sy of [-1,1])
      wheel(cx,sx,sy*r*.92,r*.34,dk,roll*.5+sx);
    plate(cx,[[r*1.1,-r*.5],[r*1.1,r*.5],[-r*1.0,r*.66],[-r*1.0,-r*.66]],body);
    cx.fillStyle='rgba(255,255,255,.24)';rr(cx,-r*.8,-r*.42,r*1.7,r*.34,4);cx.fill();
  }else if(kind==='phantom'){               // SPECTRE: floating, translucent
    cx.globalAlpha*=.86;
    cx.save();cx.globalCompositeOperation='lighter';cx.globalAlpha=.25;
    cx.fillStyle=c.light;cx.beginPath();cx.ellipse(0,0,r*1.3,r*1.05,0,0,Math.PI*2);cx.fill();cx.restore();
    plate(cx,[[r*1.15,0],[r*.3,-r*.8],[-r*.85,-r*.55],[-r*1.05,0],[-r*.85,r*.55],[r*.3,r*.8]],body);
    cx.strokeStyle='rgba(255,255,255,.5)';cx.lineWidth=2;
    for(let i=-1;i<=1;i++){cx.beginPath();cx.moveTo(-r*.6,i*r*.3);cx.lineTo(r*.5,i*r*.3);cx.stroke()}
  }else if(kind==='boxtank'){               // BULWARK: classic angled armour
    tread(cx,-r*1.02,-r*1.24,r*2.04,r*.56,dk,roll);
    tread(cx,-r*1.02, r*.68, r*2.04,r*.56,dk,roll);
    plate(cx,[[r*1.05,-r*.45],[r*1.05,r*.45],[r*.55,r*.8],[-r*.95,r*.8],[-r*.95,-r*.8],[r*.55,-r*.8]],body);
    cx.fillStyle='rgba(255,255,255,.26)';rr(cx,-r*.75,-r*.6,r*1.5,r*.42,5);cx.fill();
    cx.fillStyle='rgba(20,22,40,.35)';
    for(const p of [[-r*.72,-r*.55],[r*.62,-r*.55],[-r*.72,r*.5],[r*.62,r*.5]]){
      cx.beginPath();cx.arc(p[0],p[1],2.1,0,Math.PI*2);cx.fill();
    }
  }else if(kind==='turbine'){               // TEMPEST: spinning intake rings
    tread(cx,-r*.95,-r*1.18,r*1.9,r*.5,dk,roll);
    tread(cx,-r*.95, r*.68, r*1.9,r*.5,dk,roll);
    cx.fillStyle=body;cx.beginPath();cx.arc(0,0,r*.95,0,Math.PI*2);cx.fill();
    cx.lineWidth=3.2;cx.strokeStyle=INK;cx.stroke();
    cx.save();cx.rotate(frame*.12);
    cx.strokeStyle='rgba(255,255,255,.4)';cx.lineWidth=3;
    for(let i=0;i<4;i++){const a=i/4*Math.PI*2;
      cx.beginPath();cx.moveTo(Math.cos(a)*r*.3,Math.sin(a)*r*.3);
      cx.lineTo(Math.cos(a)*r*.82,Math.sin(a)*r*.82);cx.stroke()}
    cx.restore();
  }else if(kind==='roller'){                // CAROM: bumper-car ring
    cx.fillStyle=shade(dk,-.25);cx.beginPath();cx.arc(0,0,r*1.12,0,Math.PI*2);cx.fill();
    cx.lineWidth=3.2;cx.strokeStyle=INK;cx.stroke();
    cx.fillStyle=body;cx.beginPath();cx.arc(0,0,r*.82,0,Math.PI*2);cx.fill();cx.stroke();
    cx.strokeStyle=c.light;cx.lineWidth=3;
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2+roll*.1;
      cx.beginPath();cx.arc(0,0,r*.98,a,a+.4);cx.stroke()}
  }else if(kind==='halftrack'){             // CINDER: wheels front, track rear
    wheel(cx,r*.78,-r*.9,r*.32,dk,roll);wheel(cx,r*.78,r*.9,r*.32,dk,roll);
    tread(cx,-r*1.05,-r*1.2,r*1.35,r*.52,dk,roll);
    tread(cx,-r*1.05, r*.7, r*1.35,r*.52,dk,roll);
    plate(cx,[[r*1.05,-r*.55],[r*1.05,r*.55],[-r*1.0,r*.72],[-r*1.0,-r*.72]],body);
    cx.fillStyle=shade(dk,-.1);                       // fuel drums
    for(const sy of [-r*.42,r*.42]){rr(cx,-r*.95,sy-r*.18,r*.5,r*.36,4);cx.fill();
      cx.lineWidth=2.4;cx.strokeStyle=INK;cx.stroke()}
  }else if(kind==='artillery'){             // MORTIS: braced siege platform
    tread(cx,-r*1.05,-r*1.22,r*2.1,r*.58,dk,roll);
    tread(cx,-r*1.05, r*.66, r*2.1,r*.58,dk,roll);
    plate(cx,[[r*.9,-r*.6],[r*.9,r*.6],[-r*1.0,r*.75],[-r*1.0,-r*.75]],body);
    cx.fillStyle=shade(dk,-.15);                      // outriggers
    for(const sy of [-1,1]){rr(cx,-r*.2,sy*r*.62,r*.9,r*.22,3);cx.fill();
      cx.lineWidth=2.2;cx.strokeStyle=INK;cx.stroke()}
  }else if(kind==='railer'){                // LANCER: long spine + fins
    tread(cx,-r*1.1,-r*1.1,r*2.2,r*.46,dk,roll);
    tread(cx,-r*1.1, r*.64, r*2.2,r*.46,dk,roll);
    plate(cx,[[r*1.2,-r*.32],[r*1.2,r*.32],[-r*1.1,r*.6],[-r*1.1,-r*.6]],body);
    plate(cx,[[-r*1.05,-r*.55],[-r*1.5,-r*.95],[-r*1.5,r*.95],[-r*1.05,r*.55]],shade(dk,-.1),2.6);
    cx.strokeStyle=c.light;cx.lineWidth=2.4;
    cx.beginPath();cx.moveTo(-r*.6,0);cx.lineTo(r*1.0,0);cx.stroke();
  }else if(kind==='walker'){                // WARDEN: legged mine layer
    cx.strokeStyle=shade(dk,-.3);cx.lineWidth=5;cx.lineCap='round';
    for(const sx of [-1,1])for(const sy of [-1,1]){
      const ph=Math.sin(roll*.5+sx+sy)*4;
      cx.beginPath();cx.moveTo(sx*r*.5,sy*r*.4);
      cx.lineTo(sx*r*1.1,sy*(r*1.05)+ph);cx.stroke();
    }
    cx.lineCap='butt';
    plate(cx,[[r*.95,0],[r*.5,-r*.78],[-r*.5,-r*.78],[-r*.95,0],[-r*.5,r*.78],[r*.5,r*.78]],body);
    cx.fillStyle='rgba(20,22,40,.4)';                 // mine rack
    for(let i=-1;i<=1;i++){cx.beginPath();cx.arc(-r*.55,i*r*.32,r*.13,0,Math.PI*2);cx.fill()}
  }else{                                    // TITANIA: fortress with skirts
    tread(cx,-r*1.06,-r*1.3,r*2.12,r*.6,dk,roll);
    tread(cx,-r*1.06, r*.7, r*2.12,r*.6,dk,roll);
    cx.fillStyle=shade(dk,-.2);rr(cx,-r*1.12,-r*.9,r*2.24,r*1.8,r*.3);cx.fill();
    cx.lineWidth=3.4;cx.strokeStyle=INK;cx.stroke();
    plate(cx,[[r*1.0,-r*.6],[r*1.0,r*.6],[r*.4,r*.86],[-r*.9,r*.86],[-r*.9,-r*.86],[r*.4,-r*.86]],body);
    cx.fillStyle='rgba(255,255,255,.22)';rr(cx,-r*.7,-r*.66,r*1.4,r*.4,5);cx.fill();
    cx.strokeStyle='rgba(20,22,40,.35)';cx.lineWidth=2.4;
    rr(cx,-r*.62,-r*.55,r*1.24,r*1.1,6);cx.stroke();
  }
}
/* ---- the barrels, one per gun ---- */
function drawBarrel(o,c,r,rec){
  const dk=c.dark,g=c.gun;
  cx.fillStyle=shade(dk,-.1);cx.strokeStyle=INK;cx.lineWidth=3.2;
  const L=c.bl+r-8;
  if(g==='needler'){
    rr(cx,4-rec,-8,L,4.6,2);cx.fill();cx.stroke();
    rr(cx,4-rec, 3.4,L,4.6,2);cx.fill();cx.stroke();
  }else if(g==='stinger'){
    rr(cx,4-rec,-7.5,L,5,2.4);cx.fill();cx.stroke();
    rr(cx,4-rec, 2.5,L,5,2.4);cx.fill();cx.stroke();
    cx.fillStyle=c.light;rr(cx,L-4-rec,-9.5,4,19,2);cx.fill();cx.stroke();
  }else if(g==='gatling'){
    rr(cx,4-rec,-6,L-4,12,4);cx.fill();cx.stroke();
    cx.save();cx.translate(L-2-rec,0);cx.rotate(frame*.35);
    for(let i=0;i<4;i++){const a=i/4*Math.PI*2;
      cx.fillStyle=shade(dk,-.25);cx.beginPath();
      cx.arc(Math.cos(a)*4,Math.sin(a)*4,2.6,0,Math.PI*2);cx.fill()}
    cx.restore();
  }else if(g==='phaser'){
    rr(cx,4-rec,-5,L,10,4);cx.fill();cx.stroke();
    cx.fillStyle='rgba(180,220,255,.75)';rr(cx,L*.5,-3,L*.5,6,3);cx.fill();
  }else if(g==='howitzer'){
    cx.fillStyle=shade(dk,-.05);rr(cx,2-rec,-7.5,L*.8,15,5);cx.fill();cx.stroke();
    cx.fillStyle='#2f2f22';cx.beginPath();cx.arc(L*.8-rec,0,8,0,Math.PI*2);cx.fill();cx.stroke();
  }else if(g==='railspike'){
    rr(cx,4-rec,-3.4,L,7,3);cx.fill();cx.stroke();
    cx.strokeStyle=c.light;cx.lineWidth=2.6;
    for(let i=0;i<3;i++){cx.beginPath();cx.arc(L*.35+i*9-rec,0,5.5,-1,1);cx.stroke()}
  }else if(g==='torch'){
    rr(cx,4-rec,-5.5,L-6,11,4);cx.fill();cx.stroke();
    cx.fillStyle='#ffb703';
    cx.beginPath();cx.moveTo(L-8-rec,-8);cx.lineTo(L-rec,0);cx.lineTo(L-8-rec,8);cx.closePath();
    cx.fill();cx.stroke();
  }else if(g==='caroms'){
    rr(cx,4-rec,-5,L,10,4.5);cx.fill();cx.stroke();
    cx.fillStyle=c.light;cx.beginPath();cx.arc(L-2-rec,0,5,0,Math.PI*2);cx.fill();cx.stroke();
  }else if(g==='seeder'){
    rr(cx,4-rec,-6.5,L-4,13,5);cx.fill();cx.stroke();
    cx.fillStyle='rgba(20,22,40,.5)';
    for(let i=0;i<3;i++){cx.beginPath();cx.arc(8+i*8-rec,0,2.4,0,Math.PI*2);cx.fill()}
  }else if(g==='squall'){
    rr(cx,4-rec,-8,L-6,16,5);cx.fill();cx.stroke();
    cx.fillStyle=shade(dk,-.25);rr(cx,L-8-rec,-10,5,20,2.5);cx.fill();cx.stroke();
  }else{ // duocannon
    rr(cx,4-rec,-9.5,L,7.5,3);cx.fill();cx.stroke();
    rr(cx,4-rec, 2,  L,7.5,3);cx.fill();cx.stroke();
    cx.fillStyle=shade(dk,-.3);rr(cx,L-5-rec,-11,5,22,2.5);cx.fill();cx.stroke();
  }
}
/* ---- powerup icons, drawn like little Mario Kart items ---- */
function drawPowerIcon(id,x,y,s){
  cx.save();cx.translate(x,y);cx.scale(s/20,s/20);
  cx.lineWidth=2.6;cx.strokeStyle=INK;cx.lineJoin='round';
  const cap=(top,dots)=>{                    // mushroom-ish capsule
    cx.fillStyle='#fffaf0';rr(cx,-7,0,14,11,4);cx.fill();cx.stroke();
    cx.fillStyle=top;cx.beginPath();cx.arc(0,0,11,Math.PI,0);cx.fill();cx.stroke();
    cx.fillStyle='rgba(255,255,255,.85)';
    (dots||[[-5,-4],[5,-5],[0,-8]]).forEach(d=>{cx.beginPath();cx.arc(d[0],d[1],2.4,0,Math.PI*2);cx.fill()});
  };
  if(id==='rapid'){                          // red boost mushroom
    cap('#ef3e4a');
  }else if(id==='triple'){                   // three shells fanned
    for(let i=-1;i<=1;i++){
      cx.save();cx.translate(i*7,Math.abs(i)*2);
      cx.fillStyle='#ffd23f';cx.beginPath();cx.arc(0,0,5.5,0,Math.PI*2);cx.fill();cx.stroke();
      cx.fillStyle='#fffaf0';cx.beginPath();cx.arc(0,1.5,3,0,Math.PI);cx.fill();
      cx.restore();
    }
  }else if(id==='big'){                      // heavy round with impact spikes
    cx.fillStyle='#ff8c42';cx.beginPath();cx.arc(0,0,10,0,Math.PI*2);cx.fill();cx.stroke();
    cx.fillStyle='#fff';cx.beginPath();cx.arc(-3,-3,3,0,Math.PI*2);cx.fill();
  }else if(id==='pierce'){                   // arrow through a plate
    cx.fillStyle='#c9c4ae';rr(cx,-4,-11,8,22,3);cx.fill();cx.stroke();
    cx.fillStyle='#ef3e4a';
    cx.beginPath();cx.moveTo(12,0);cx.lineTo(2,-7);cx.lineTo(2,-3);cx.lineTo(-12,-3);
    cx.lineTo(-12,3);cx.lineTo(2,3);cx.lineTo(2,7);cx.closePath();cx.fill();cx.stroke();
  }else if(id==='shield'){                   // classic crest
    cx.fillStyle='#3d7ea6';
    cx.beginPath();cx.moveTo(0,-11);cx.lineTo(10,-6);cx.lineTo(10,3);
    cx.quadraticCurveTo(10,10,0,12);cx.quadraticCurveTo(-10,10,-10,3);
    cx.lineTo(-10,-6);cx.closePath();cx.fill();cx.stroke();
    cx.fillStyle='rgba(255,255,255,.5)';
    cx.beginPath();cx.moveTo(0,-8);cx.lineTo(6,-5);cx.lineTo(6,2);cx.lineTo(0,4);cx.closePath();cx.fill();
  }else if(id==='heal'){                      // green cross capsule
    cap('#35a44a',[[-5,-5],[5,-4]]);
    cx.fillStyle='#fff';cx.fillRect(-2,-8,4,9);cx.fillRect(-6,-6,12,4);
  }else if(id==='star'){                      // the star
    const g=cx.createLinearGradient(0,-12,0,12);
    g.addColorStop(0,'#fff3a8');g.addColorStop(1,'#e7a600');
    cx.fillStyle=g;cx.beginPath();
    for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,rr2=i%2?5.2:12;
      cx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}
    cx.closePath();cx.fill();cx.stroke();
    cx.fillStyle=INK;cx.beginPath();cx.arc(-3,-1,1.4,0,Math.PI*2);cx.arc(3,-1,1.4,0,Math.PI*2);cx.fill();
  }else if(id==='speed'){                     // chevrons
    cx.fillStyle='#2ec4b6';
    for(let i=-1;i<=1;i++){
      cx.beginPath();cx.moveTo(i*7-3,-9);cx.lineTo(i*7+5,0);cx.lineTo(i*7-3,9);
      cx.lineTo(i*7-1,0);cx.closePath();cx.fill();cx.stroke();
    }
  }else if(id==='ghost'){                     // boo-ish ghost
    cx.fillStyle='#e9edf7';
    cx.beginPath();cx.arc(0,-2,10,Math.PI,0);
    cx.lineTo(10,7);cx.lineTo(6,3);cx.lineTo(2,7);cx.lineTo(-2,3);cx.lineTo(-6,7);cx.lineTo(-10,3);
    cx.closePath();cx.fill();cx.stroke();
    cx.fillStyle=INK;cx.beginPath();cx.arc(-3.5,-3,1.9,0,Math.PI*2);cx.arc(3.5,-3,1.9,0,Math.PI*2);cx.fill();
  }else if(id==='mine'){                      // sea-mine with spikes
    cx.fillStyle='#454458';
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2;
      cx.save();cx.rotate(a);cx.fillRect(-1.6,-12,3.2,5);cx.restore()}
    cx.beginPath();cx.arc(0,0,8.5,0,Math.PI*2);cx.fill();cx.stroke();
    cx.fillStyle='#ef3e4a';cx.beginPath();cx.arc(0,0,3,0,Math.PI*2);cx.fill();
  }else if(id==='freeze'){                    // snowflake
    cx.strokeStyle='#4cc9f0';cx.lineWidth=3;cx.lineCap='round';
    for(let i=0;i<3;i++){const a=i/3*Math.PI;
      cx.beginPath();cx.moveTo(-Math.cos(a)*11,-Math.sin(a)*11);
      cx.lineTo(Math.cos(a)*11,Math.sin(a)*11);cx.stroke();
      for(const s2 of [-1,1]){
        cx.beginPath();cx.moveTo(Math.cos(a)*7*s2,Math.sin(a)*7*s2);
        cx.lineTo(Math.cos(a+0.9)*11*s2,Math.sin(a+0.9)*11*s2);cx.stroke();
      }
    }
    cx.lineCap='butt';
  }else{                                      // flip: swirl
    cx.strokeStyle='#ff8c42';cx.lineWidth=3.4;
    cx.beginPath();cx.arc(0,0,8,0.6,Math.PI*1.7);cx.stroke();
    cx.fillStyle='#ff8c42';
    cx.beginPath();cx.moveTo(9,-4);cx.lineTo(2,-6);cx.lineTo(6,2);cx.closePath();cx.fill();
  }
  cx.restore();
}

function screenBg(tint){

function modeIcon(kind,x,y,r,col){

    cx.fill();cx.stroke();

      cx.globalAlpha=1-i*.25;

    cx.fillStyle='#fff';cx.beginPath();cx.arc(0,0,r*.7,0,Math.PI*2);cx.fill();cx.stroke();
    cx.fillStyle=INK;

    cx.beginPath();cx.arc(0,0,r*.18,0,Math.PI*2);cx.fill();

    cx.lineTo(-r*.5,r*.7);cx.lineTo(-r*.75,-r*.2);cx.closePath();cx.fill();cx.stroke();
    cx.fillStyle='#ffd166';
    cx.beginPath();cx.arc(-r*.25,0,r*.13,0,Math.PI*2);cx.arc(r*.25,0,r*.13,0,Math.PI*2);cx.fill();
  }else if(kind==='net'){
    cx.beginPath();cx.arc(0,0,r*.72,0,Math.PI*2);cx.stroke();
    cx.beginPath();cx.ellipse(0,0,r*.32,r*.72,0,0,Math.PI*2);cx.stroke();
    cx.beginPath();cx.moveTo(-r*.72,0);cx.lineTo(r*.72,0);cx.stroke();
  }else if(kind==='card'){
    rr(cx,-r*.8,-r*.55,r*1.6,r*1.1,5);cx.fill();cx.stroke();
    cx.fillStyle=CREAM;cx.beginPath();cx.arc(-r*.35,-r*.05,r*.25,0,Math.PI*2);cx.fill();
    cx.fillRect(r*.02,-r*.2,r*.62,r*.12);cx.fillRect(r*.02,r*.02,r*.45,r*.12);
  }
  cx.restore();
}

/* ================= ONLINE (self-hosted build only) =================
   Host-authoritative: the host simulates and broadcasts snapshots at 20Hz,
   the guest sends its input and renders what it is told. Needs relay-server.js. */
const RKEY='tanksmash_relay_v1';
/* Set this to your own Render service and players never have to type a URL.
   Order of preference: ?relay= in the link > saved value > this default. */
const DEFAULT_RELAY='wss://karhutrades.com/ws';
const NET={
  ws:null,role:null,code:'',status:'IDLE',msg:'',
  relay:'',editing:false,field:0,
  connected:false,peer:false,ready:false,waking:false,wakeTries:0,wakeStart:0,quick:false,qslot:0,
  theirClass:null,theirName:'OPPONENT',theirColor:'#35a44a',
  lastSent:null,sentAt:0,snapAt:0,lastRecv:0,ping:0,
};
let autoRoom='';
try{
  const qs=new URLSearchParams(location.search);
  const q=qs.get('relay');
  autoRoom=(qs.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  NET.relay=q||localStorage.getItem(RKEY)||'';
  if(q)localStorage.setItem(RKEY,q);
}catch(e){}
if(!NET.relay){
  NET.relay=(location.hostname==='localhost'||location.hostname==='127.0.0.1')
    ?'ws://localhost:8787':DEFAULT_RELAY;
}
const netHost=()=>NET.role==='host';
function netSend(o){
  if(NET.ws&&NET.ws.readyState===1){try{NET.ws.send(JSON.stringify(o))}catch(e){}}
}
function netStatus(s,m){NET.status=s;NET.msg=m||''}
function netDisconnect(){

function relayHttp(){return NET.relay.replace(/^wss:/,'https:').replace(/^ws:/,'http:')}
/* Free hosts sleep when idle. Poll /health first so a cold start shows as
   "waking" instead of a failed connection, then open the socket. */
async function netWake(){
  NET.waking=true;NET.wakeTries=0;NET.wakeStart=Date.now();
  for(let i=0;i<20;i++){
    NET.wakeTries=i+1;
    const secs=Math.round((Date.now()-NET.wakeStart)/1000);
    netStatus('WAKING','relay starting up · '+secs+'s (free hosts sleep when idle)');
    try{
      const ctl=new AbortController();
      const to=setTimeout(()=>ctl.abort(),5000);
      const r=await fetch(relayHttp()+'/health',{cache:'no-store',signal:ctl.signal});
      clearTimeout(to);
      if(r.ok){NET.waking=false;return true}
    }catch(e){}
    await new Promise(r=>setTimeout(r,2500));
  }
  NET.waking=false;
  return false; // try the socket anyway: /health may be blocked while WS is fine
}
async function netConnect(role,code){
  netDisconnect();
  NET.role=role==='auto'?null:role;NET.code=code;
  await netWake();
  if(NET.code!==code)return; // superseded while waking
  netStatus('CONNECTING','opening '+NET.relay);
  let ws;
  try{ws=new WebSocket(NET.relay)}
  catch(e){netStatus('FAILED','cannot open a socket here: '+e.message);return}
  NET.ws=ws;
  setTimeout(()=>{if(NET.ws===ws&&ws.readyState===0){netStatus('FAILED','no answer from '+NET.relay+' · check the URL (wss:// for https pages)')}},12000);
  ws.onopen=()=>{netStatus('WAITING',(NET.quick?'quick match':'room '+code)+' · waiting for the other player');netSend({t:'join',room:code,role:role==='auto'?undefined:role})};
  ws.onerror=()=>netStatus('FAILED','could not reach '+NET.relay);
  ws.onclose=()=>{if(NET.status!=='FAILED')netStatus('CLOSED','connection closed');NET.connected=false;NET.peer=false};
  ws.onmessage=ev=>{
    let m;try{m=JSON.parse(ev.data)}catch(e){return}
    NET.lastRecv=frame;
    if(m.t==='role'){NET.role=m.role;NET.connected=true;netStatus(m.peers>1?'READY':'WAITING',m.peers>1?'opponent connected':'room '+code+' · waiting');NET.peer=m.peers>1;if(NET.peer)netEnterSelect()}
    else if(m.t==='peer'){NET.peer=true;netStatus('READY','opponent connected');sLock();netEnterSelect()}
    else if(m.t==='peerleft'){NET.peer=false;NET.theirClass=null;netStatus('WAITING','opponent left');if(state!=='online'){toast={txt:'OPPONENT LEFT',life:200};goto('online')}}
    else if(m.t==='pick'){NET.theirClass=m.cls;NET.theirName=(m.name||'OPPONENT').slice(0,12);NET.theirColor=m.color||'#35a44a';if(netHost())netTryStart()}
    else if(m.t==='start'&&!netHost())netGuestStart(m);
    else if(m.t==='snap'&&!netHost())netApplySnap(m);
    else if(m.t==='in'&&netHost()){const o=tanks[1];if(o)o.netInput={dx:m.dx,dy:m.dy,fire:!!m.f}}
    else if(m.t==='full'){
      if(NET.quick&&NET.qslot<6){NET.qslot++;const nxt='PLAY'+(NET.qslot+1);
        netStatus('WAITING','room busy, trying another');NET.code=nxt;netSend({t:'join',room:nxt})}
      else{netStatus('FAILED','that room already has two players')}
    }
    else if(m.t==='bye'){NET.peer=false;netStatus('WAITING','opponent left')}
  };
}
function netEnterSelect(){
  if(state==='online'){mode='online';enterSelect()}
}
setInterval(()=>{if(NET.ws&&NET.ws.readyState===1)netSend({t:'hb'})},20000);
/* a quick-matcher stuck WAITING hops lobbies in case the room held a zombie */
setInterval(()=>{
  if(NET.quick&&NET.status==='WAITING'&&NET.connected&&!NET.peer){
    NET.qslot=(NET.qslot+1)%6;
    const nxt=NET.qslot===0?'PLAY':'PLAY'+(NET.qslot+1);
    NET.code=nxt;netSend({t:'join',room:nxt,role:undefined});
    netStatus('WAITING','looking for a player · lobby '+(NET.qslot+1));
  }
},20000);
/* opened from a shared ?room= link: jump straight into that room */
if(autoRoom){
  mode='online';state='online';NET.code=autoRoom;
  setTimeout(()=>{audioOn();netConnect('auto',autoRoom)},350);
}
/* ---- lobby screen ---- */
const CODE_CHARS='0123456789';
function randomCode(){let s='';for(let i=0;i<4;i++)s+=CODE_CHARS[Math.random()*CODE_CHARS.length|0];return s}
function roomLink(code){
  const base=location.origin+location.pathname;
  return base+'?room='+code;
}
function copyLink(){
  const txt=roomLink(NET.code);
  try{
    navigator.clipboard.writeText(txt).then(
      ()=>{toast={txt:'LINK COPIED',life:170}},
      ()=>{toast={txt:txt,life:260}});
  }catch(e){toast={txt:txt,life:260}}
  sLock();
}
/* one key = play someone. everyone who presses it lands in the same lobby room. */
function quickMatch(){NET.qslot=0;NET.code='PLAY';NET.quick=true;netConnect('auto','PLAY');sLock()}
function privateRoom(){NET.code=randomCode();NET.quick=false;netConnect('host',NET.code);sLock()}
function joinTyped(){
  const c=typeBuf.replace(/[^0-9]/g,'').slice(0,4);
  if(c.length<4){toast={txt:'TYPE ALL 4 DIGITS',life:160};sBack();return}
  NET.code=c;NET.quick=false;typeBuf='';netConnect('auto',c);sLock();
}
function netKey(e){
  if(NET.editing){
    if(e.key&&e.key.length===1&&/[a-zA-Z0-9 _.:\/-]/.test(e.key)&&typeBuf.length<64)typeBuf+=e.key.toLowerCase();
    if(e.code==='Backspace')typeBuf=typeBuf.slice(0,-1);
    return;
  }
  if(/^[0-9]$/.test(e.key)&&typeBuf.length<4)typeBuf+=e.key;
  if(e.code==='Backspace')typeBuf=typeBuf.slice(0,-1);
}
const PAD_KEYS=['1','2','3','4','5','6','7','8','9','DEL','0','GO'];
function padRect(i){const kw=74,kh=52,gap=8,x0=W/2-(3*kw+2*gap)/2,y0=196;
  return{x:x0+(i%3)*(kw+gap),y:y0+((i/3)|0)*(kh+gap),w:kw,h:kh}}
function netTap(p){
  const hit=(x,y,w,h)=>p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;
  if(NET.pad){
    for(let i=0;i<12;i++){
      const r=padRect(i);
      if(hit(r.x,r.y,r.w,r.h)){
        const k=PAD_KEYS[i];
        if(k==='DEL')typeBuf=typeBuf.slice(0,-1);
        else if(k==='GO'){if(typeBuf.length===4){NET.pad=false;joinTyped()}else sBack()}
        else if(typeBuf.length<4){typeBuf+=k;sTick();if(typeBuf.length===4){NET.pad=false;joinTyped()}}
        return;
      }
    }
    NET.pad=false;typeBuf='';sBack();return; // tap outside closes
  }
  const busy=NET.waking||NET.status==='CONNECTING'||NET.status==='WAITING';
  if(busy){if(hit(0,H-40,W,40)){netDisconnect();netStatus('IDLE','');NET.waking=false;sBack()}return}
  const w=280,h=150,y=132,x0=W/2-w*1.5-20;
  if(hit(x0,y,w,h)){quickMatch();return}
  if(hit(x0+w+20,y,w,h)){NET.pad=true;typeBuf='';sTick();return}
  if(hit(x0+(w+20)*2,y,w,h)){privateRoom();return}
  if(NET.code&&NET.role&&hit(W/2,304,330,116)){copyLink();return}
  if(hit(0,0,70,70)){netDisconnect();sBack();goto('mode')}
}
stepOnline=function(){
  if(NET.pad){
    if(pressQ.has('Escape')){NET.pad=false;typeBuf='';sBack()}
    if(pressQ.has('Enter')&&typeBuf.length===4){NET.pad=false;joinTyped()}
    return;
  }
  if(NET.editing){
    if(pressQ.has('Enter')){
      NET.relay=typeBuf.trim().toLowerCase()||NET.relay;
      try{localStorage.setItem(RKEY,NET.relay)}catch(e){}
      NET.editing=false;typeBuf='';sLock();
    }
    if(pressQ.has('Escape')){NET.editing=false;typeBuf='';sBack()}
    return;
  }
  // typing letters builds a room code; enter joins it
  if(typeBuf.length){
    if(pressQ.has('Enter')){joinTyped();return}
    if(pressQ.has('Escape')){typeBuf='';sBack();return}
    return;
  }
  if(pressQ.has('Space')){quickMatch();return}
  if(pressQ.has('KeyH')){privateRoom();return}
  if(pressQ.has('KeyL')&&NET.code){copyLink();return}
  if(pressQ.has('KeyR')){NET.editing=true;typeBuf=NET.relay;sTick();return}
  if(pressQ.has('KeyX')){netDisconnect();netStatus('IDLE','');NET.waking=false;sBack();return}
  if(navBack()){netDisconnect();sBack();goto('mode')}
};
drawOnline=function(){
  screenBg('#1e3350');
  splash('PLAY ONLINE',46,52);
  if(NET.pad){
    panel(W/2-160,120,320,330,'#ffd23f',18);
    label('ENTER ROOM CODE',W/2,136,14,'#fff');
    cx.fillStyle=INK;cx.font='900 34px system-ui,Arial,sans-serif';
    cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText((typeBuf||'')+'----'.slice(typeBuf.length),W/2,172);
    for(let i=0;i<12;i++){
      const r=padRect(i),k=PAD_KEYS[i];
      cx.fillStyle=k==='GO'?'#35a44a':k==='DEL'?'#ef3e4a':CREAM;
      rr(cx,r.x,r.y,r.w,r.h,10);cx.fill();
      cx.strokeStyle=INK;cx.lineWidth=3;rr(cx,r.x,r.y,r.w,r.h,10);cx.stroke();
      label(k,r.x+r.w/2,r.y+r.h/2+1,k.length>1?13:20,(k==='GO'||k==='DEL')?'#fff':INK);
    }
    footer('TAP OUTSIDE TO CANCEL');
    return;
  }
  const busy=NET.waking||NET.status==='CONNECTING'||NET.status==='WAITING';
  if(NET.editing){
    panel(W/2-330,150,660,150,'#3d7ea6',16);
    label('RELAY SERVER ADDRESS',W/2,166,14,'#fff');
    label(typeBuf+((frame>>4)%2?'_':''),W/2,220,17,INK);
    label('ENTER to save   ·   ESC to cancel',W/2,262,13,'#8a8672');
    footer('BOTH PLAYERS MUST USE THE SAME RELAY');
    return;
  }
  if(busy){
    panel(W/2-300,140,600,190,'#3d7ea6',16);
    label(NET.waking?'WAKING THE SERVER':'CONNECTING',W/2,156,14,'#fff');
    // spinner of little tanks
    for(let i=0;i<3;i++){
      const a=frame*.05+i*2.1;
      cx.save();cx.translate(W/2+Math.cos(a)*54,232+Math.sin(a)*18);cx.scale(.7,.7);
      drawTankBody({x:0,y:0,ang:a,cls:CLASSES[i*3%CLASSES.length],recoil:0,dist:frame});
      cx.restore();
    }
    label(NET.msg||'talking to '+NET.relay,W/2,292,12,'#8a8672');
    if(NET.code)label(NET.quick?'QUICK MATCH':'ROOM '+NET.code,W/2,314,13,INK);
    footer('X TO CANCEL');
    drawToast();
    return;
  }
  // main lobby: three big choices
  const cards=[
    {k:'SPACE',t:'QUICK MATCH',s:'play whoever is waiting',c:'#35a44a'},
    {k:'0-9',t:typeBuf?typeBuf+((frame>>4)%2?'_':''):'JOIN A CODE',s:typeBuf?'ENTER to join':'just type the 4 digits',c:'#ffd23f'},
    {k:'H',t:'PRIVATE ROOM',s:'get a code + link to share',c:'#ef3e4a'},
  ];
  cards.forEach((cd,i)=>{
    const w=280,h=150,x=W/2-w*1.5-20+i*(w+20),y=132;
    if(i===1&&typeBuf)selectRing(x,y,w,h,cd.c,16);
    panel(x,y,w,h,cd.c,16);
    label(cd.t,x+w/2,y+16,15,'#fff');
    cx.fillStyle=INK;cx.font='900 30px system-ui,Arial,sans-serif';
    cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(cd.k,x+w/2,y+78);
    label(cd.s,x+w/2,y+120,12,'#8a8672');
  });
  // room / status strip
  panel(W/2-330,304,660,116,null,16);
  if(NET.status==='READY'||NET.peer){
    label('OPPONENT CONNECTED',W/2,330,15,'#35a44a');
    label('starting the tank select...',W/2,356,12,'#8a8672');
  }else if(NET.code&&NET.role){
    label('YOUR ROOM CODE',W/2-160,330,12,'#8a8672');
    cx.fillStyle=INK;cx.font='900 44px system-ui,Arial,sans-serif';
    cx.textAlign='center';cx.textBaseline='middle';cx.fillText(NET.code,W/2-160,368);
    label('SHARE THE LINK',W/2+150,330,12,'#8a8672');
    label(roomLink(NET.code).replace(/^https?:\/\//,'').slice(0,34),W/2+150,356,12,INK);
    label('PRESS L TO COPY IT',W/2+150,382,12,'#3d7ea6');
  }else{
    label('SPACE plays whoever is waiting. Or host a room and read out 4 digits.',W/2,340,14,INK);
    label(NET.status==='FAILED'?('problem: '+NET.msg):('relay: '+NET.relay.replace(/^wss?:\/\//,'')),
      W/2,372,12,NET.status==='FAILED'?'#ef3e4a':'#8a8672');
  }
  label('R  change relay server',W/2,436,12,'#c9c4ae');
  footer('ESC BACK   ·   IN A MATCH, WASD OR ARROWS BOTH DRIVE YOUR TANK');
  drawToast();
};
/* ---- select / start handshake ---- */
onLockIn=function(p){
  if(mode!=='online')return;
  netSend({t:'pick',cls:sel[0].i,name:prof(0).name,color:prof(0).color});
  if(netHost())netTryStart();
};
netBlockStart=function(){
  if(mode!=='online')return false;
  return !(NET.peer&&NET.theirClass!==null&&netHost());
};
function netTryStart(){
  if(!netHost()||!sel[0].locked||NET.theirClass===null)return;
  netStartMatch();
}
function netStartMatch(){
  mode='online';matchDone=false;
  tanks=[makeTank(0,sel[0].i,true,null,0,prof(0).color),
         makeTank(1,NET.theirClass,true,null,0,NET.theirColor)];
  tanks[0].netLocal=true;tanks[1].remote=true;tanks[1].netInput={dx:0,dy:0,fire:false};
  tanks[1].name=NET.theirName;
  tanks.forEach(t=>{t.teamColor=t.profColor||TEAMS[t.team].color});
  mapIndex=0;
  netSend({t:'start',mapIndex,a:sel[0].i,b:NET.theirClass,
    an:prof(0).name,ac:prof(0).color,scores:[0,0]});
  startRound();
}
function netGuestStart(m){
  mode='online';matchDone=false;
  // the guest is tank index 1 on the host, and drives it locally
  tanks=[makeTank(0,m.a,true,null,0,m.ac||'#ef3e4a'),
         makeTank(1,m.b,true,null,0,prof(0).color)];
  tanks[0].name=(m.an||'HOST').slice(0,12);
  tanks[1].name=prof(0).name;tanks[1].netLocal=true;
  tanks.forEach(t=>{t.teamColor=t.profColor||TEAMS[t.team].color});
  mapIndex=m.mapIndex|0;
  startRound();
}
/* ---- snapshots ---- */
function netSnapshot(){
  const dead=[];
  for(const k in crateHp)if(crateHp[k]<=0)dead.push(+k);
  return{t:'snap',f:frame,st:state,tm:timer,mi:mapIndex,
    tk:tanks.map(t=>({x:Math.round(t.x*4)/4,y:Math.round(t.y*4)/4,a:Math.round(t.ang*100)/100,ta:Math.round((t.tang==null?t.ang:t.tang)*100)/100,ru:t.roul?t.roul.idx:-1,
      hp:t.hp,iv:t.inv,sh:t.shield,rc:Math.round(t.recoil),ds:Math.round(t.dist),sc:t.score,
      fz:t.fx.frozen,rv:t.fx.reverse,st:t.fx.star,gh:t.fx.ghost})),
    bl:bullets.map(b=>({x:Math.round(b.x),y:Math.round(b.y),r:b.r,g:b.gun,
      ai:b.air?1:0,li:b.life,l0:b.life0,ph:b.phase?1:0,px:Math.round(b.px),py:Math.round(b.py)})),
    pu:pickups.map(p=>({x:p.x,y:p.y})),
    mn:mines.map(m=>({x:Math.round(m.x),y:Math.round(m.y),a:m.arm})),
    cr:dead,rw:roundWinner?roundWinner.team:-1};
}
function netApplySnap(m){
  if(m.mi!==mapIndex&&MAPS[m.mi]){mapIndex=m.mi;startRound()}
  frame=m.f;state=m.st;timer=m.tm;
  m.tk.forEach((s,i)=>{
    const t=tanks[i];if(!t)return;
    t.x=s.x;t.y=s.y;t.ang=s.a;t.tang=s.ta;t.hp=s.hp;t.inv=s.iv;t.shield=s.sh;
    t.roul=s.ru>=0?{n:99,idx:s.ru}:null;
    t.recoil=s.rc;t.dist=s.ds;t.score=s.sc;
    t.fx.frozen=s.fz;t.fx.reverse=s.rv;t.fx.star=s.st;t.fx.ghost=s.gh;
  });
  bullets=m.bl.map(b=>({x:b.x,y:b.y,px:b.px,py:b.py,r:b.r,gun:b.g,air:!!b.ai,
    life:b.li,life0:b.l0,phase:!!b.ph,vx:0,vy:0,dmg:1,bounces:0}));
  pickups=m.pu.map(p=>({x:p.x,y:p.y,age:0}));
  mines=m.mn.map(x=>({x:x.x,y:x.y,arm:x.a,life:900,owner:tanks[0]}));
  for(const k of m.cr){if(crateHp[k]>0){crateHp[k]=0;const gx=k%COLS,gy=(k/COLS)|0;cells[gy][gx]='.'}}
  roundWinner=m.rw>=0?tanks[m.rw]:roundWinner;
}
/* ---- drive the loop ---- */
const _step=step;
step=function(){
  if(mode!=='online'||!NET.connected||state==='online'||state==='mode'||state==='title'||state==='profiles'||state==='name'){
    _step();return;
  }
  if(netHost()){
    _step();
    if(frame%3===0)netSend(netSnapshot());
  }else{
    // guest: cosmetics locally, everything else comes from the host
    frame++;
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.92;p.vy*=.92;if(--p.life<=0)parts.splice(i,1)}
    for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y-=.7;if(--f.life<=0)floats.splice(i,1)}
    for(let i=marks.length-1;i>=0;i--){if(--marks[i].life<=0)marks.splice(i,1)}
    if(shake>0)shake*=.86;
    stepAmbient();
    if(state==='select'){stepSelect();pressQ.clear();return}
    const t=tanks[1];
    if(t){
      const inp=humanInput(t);
      const sig=inp.dx+','+inp.dy+','+inp.fire;
      if(sig!==NET.lastSent||frame-NET.sentAt>10){
        NET.lastSent=sig;NET.sentAt=frame;
        netSend({t:'in',dx:inp.dx,dy:inp.dy,f:inp.fire});
      }
      if(inp.dx||inp.dy)t.ang=lerpAngle(t.ang,Math.atan2(inp.dy,inp.dx),.3); // hull only; turret comes from the host
    }
    if(state==='game'&&navOk()){netSend({t:'again'});}
    pressQ.clear();
  }
};
/* connection loss during a match drops you back to the lobby */
const _draw=draw;
draw=function(){
  _draw();
  if(mode==='online'&&NET.connected&&state!=='online'){
    const bad=!NET.peer;
    panel(W-190,H-30,176,22,null,8);
    label(bad?'OPPONENT LOST':(netHost()?'ONLINE · HOST':'ONLINE · GUEST'),W-102,H-19,11,bad?'#ef3e4a':'#8a8672');
  }
};
